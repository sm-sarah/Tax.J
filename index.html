<style>
  :root{
    --bg:#f1f1fb;
    --card:#ffffff;
    --border:#eceafc;
    --text:#211f3d;
    --muted:#8f8ca8;
    --muted-soft:#b5b2ca;

    --primary:#5b5fef;
    --primary-dark:#4547c9;
    --primary-soft:#edeefd;

    --mint:#10b981;
    --mint-soft:#e6f9f1;
    --blue:#3b82f6;
    --blue-soft:#eaf2ff;
    --rose:#f43f5e;
    --rose-soft:#ffe9ed;
    --violet:#8b5cf6;
    --violet-soft:#f3eefe;
    --amber:#f59e0b;
    --amber-soft:#fff5e6;
    --slate:#475569;
    --slate-soft:#eef1f5;

    --shadow-sm: 0 1px 2px rgba(33,31,61,.05);
    --shadow-md: 0 1px 3px rgba(33,31,61,.05), 0 10px 24px -8px rgba(33,31,61,.12);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== 헤더 ===== */
  header{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:14px 28px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
  }
  header .wordmark{
    justify-self:center;
    font-family:'Fraunces', Georgia, serif;
    font-style:italic;
    font-size:21px;
    font-weight:600;
    color:var(--text);
    letter-spacing:.2px;
  }
  header .today-pill{
    justify-self:end;
    font-size:12.5px;
    color:var(--muted);
    background:var(--bg);
    padding:6px 14px;
    border-radius:999px;
  }

  /* ===== 레이아웃: 사이드바 + 본문 ===== */
  .app-shell{ display:flex; align-items:flex-start; }

  aside.sidebar{
    width:96px;
    flex:none;
    padding:24px 14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
  }
  .nav-item{
    width:68px;
    padding:12px 4px 10px;
    border-radius:18px;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    gap:6px;
    cursor:pointer;
    border:none;
    background:var(--card);
    color:var(--muted);
    box-shadow:var(--shadow-sm);
    transition:transform .12s, box-shadow .12s, background .12s, color .12s;
  }
  .nav-item svg{ width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .nav-item .tiny{
    font-size:10.5px; font-weight:700; white-space:nowrap;
  }
  .nav-item:hover{ transform:translateY(-1px); box-shadow:var(--shadow-md); }
  .nav-item.active{
    background:var(--primary-soft);
    color:var(--primary-dark);
    box-shadow:var(--shadow-md);
  }

  .nav-gutter{
    width:168px;
    flex:none;
    align-self:stretch;
    border-right:1px solid var(--border);
  }
  .nav-wrap{ position:relative; width:100%; display:flex; justify-content:center; }
  .nav-flyout{
    position:absolute;
    left:calc(100% + 18px);
    top:6px;
    min-width:150px;
    background:transparent;
    border:none;
    box-shadow:none;
    padding-left:14px;
    display:flex;
    flex-direction:column;
    gap:0;
    opacity:0;
    visibility:hidden;
    transform:translateX(-4px);
    transition:opacity .12s, transform .12s, visibility .12s;
    z-index:40;
  }
  .nav-flyout.open{
    opacity:1; visibility:visible; transform:translateX(0);
  }
  .nav-flyout::before{
    content:'';
    position:absolute;
    left:0; top:4px; bottom:4px;
    width:1.5px;
    border-radius:2px;
    background:linear-gradient(180deg, var(--primary), var(--mint));
    opacity:.4;
  }
  .nav-flyout-item{
    position:relative;
    font-family:inherit; font-size:13.5px; font-weight:600;
    text-align:left; white-space:nowrap;
    padding:9px 0 9px 14px; border:none;
    background:transparent; color:var(--text); cursor:pointer;
  }
  .nav-flyout-item::before{
    content:'';
    position:absolute;
    left:-14px; top:50%;
    width:10px; height:1.5px;
    background:var(--border);
    transform:translateY(-50%);
  }
  .nav-flyout-item:hover{ color:var(--primary-dark); }
  .nav-flyout-item:hover::before{ background:var(--primary); }

  main{
    flex:1;
    min-width:0;
    padding:28px 32px 60px;
  }
  .page-head{ margin-bottom:22px; text-align:center; }
  .page-head:empty{ margin-bottom:0; }
  .page-head h1{
    font-size:22px;
    font-weight:800;
    margin:0 0 8px;
    letter-spacing:-.3px;
  }
  .underline-bar{
    width:52px; height:5px;
    border-radius:999px;
    background:linear-gradient(90deg,var(--mint),var(--primary));
    margin:0 auto 8px;
  }
  .page-head .subtitle{ color:var(--muted); font-size:13px; }

  .tab{ display:none; }
  .tab.active{ display:block; }

  /* ===== 카드 ===== */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:22px 24px;
    margin-bottom:18px;
    box-shadow:var(--shadow-sm);
  }
  .card h2{
    font-size:15.5px;
    margin:0 0 4px;
    font-weight:800;
    display:flex; align-items:center; gap:8px;
  }
  .card .desc{
    color:var(--muted);
    font-size:12.5px;
    margin-bottom:16px;
  }

  .hero-row{
    display:flex; gap:16px; flex-wrap:wrap; margin-bottom:18px;
  }
  .hero-tile{
    flex:1; min-width:180px;
    border-radius:var(--radius-lg);
    padding:20px 22px;
    box-shadow:var(--shadow-sm);
    position:relative;
    overflow:hidden;
  }
  .hero-tile .n{ font-size:30px; font-weight:800; line-height:1; }
  .hero-tile .label{ font-size:12.5px; font-weight:700; margin-top:8px; opacity:.85; }
  .hero-tile.tone-amber{ background:linear-gradient(135deg,#fff1e0,#ffe3d6); color:#b45309; }
  .hero-tile.tone-indigo{ background:linear-gradient(135deg,#e9eafd,#dfe1fb); color:var(--primary-dark); }
  .hero-tile.tone-mint{ background:linear-gradient(135deg,#e2f9ef,#d3f3e6); color:#047857; }

  .toolbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;
  }
  select, input[type=text], input[type=date], input[type=number]{
    font-family:inherit; font-size:13px;
    padding:8px 12px;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    background:var(--bg);
    color:var(--text);
  }
  select:focus, input:focus{ outline:2px solid var(--primary-soft); border-color:var(--primary); }

  button.btn{
    font-family:inherit; font-size:12.5px; font-weight:700;
    padding:8px 16px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    cursor:pointer;
  }
  button.btn:hover{ background:var(--bg); }
  button.btn.primary{ background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:var(--shadow-sm); }
  button.btn.primary:hover{ background:var(--primary-dark); }
  button.btn.ghost{ border-color:transparent; color:var(--muted); background:transparent; }
  button.btn.danger{ color:var(--rose); }
  .spacer{ flex:1; }

  .summary-row{ display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .stat{
    flex:1; min-width:110px;
    border-radius:var(--radius-md);
    padding:14px 16px;
    background:var(--bg);
  }
  .stat.tone-mint{ background:var(--mint-soft); }
  .stat.tone-blue{ background:var(--blue-soft); }
  .stat.tone-rose{ background:var(--rose-soft); }
  .stat.tone-violet{ background:var(--violet-soft); }
  .stat .n{ font-size:21px; font-weight:800; }
  .stat .label{ font-size:11.5px; color:var(--muted); margin-top:3px; font-weight:600; }

  .progress-bar{ height:8px; background:var(--border); border-radius:999px; overflow:hidden; margin-top:10px; }
  .progress-bar .fill{ height:100%; border-radius:999px; transition:width .2s; }
  .fill.tone-mint{ background:linear-gradient(90deg,#34d399,var(--mint)); }
  .fill.tone-blue{ background:linear-gradient(90deg,#60a5fa,var(--blue)); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th, td{ text-align:left; padding:10px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  th{ color:var(--muted-soft); font-weight:800; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  td.note-cell{ white-space:normal; min-width:160px; }
  .table-scroll{ overflow-x:auto; }

  .pill{ display:inline-block; padding:4px 11px; border-radius:999px; font-size:11.5px; font-weight:700; }
  .pill.ok{ background:var(--mint-soft); color:#059669; }
  .pill.warn{ background:var(--amber-soft); color:#b45309; }
  .pill.danger{ background:var(--rose-soft); color:#e11d48; }
  .pill.muted{ background:var(--slate-soft); color:var(--muted); }

  .tag{ display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:800; }
  .tag.tag-vat{ background:var(--mint-soft); color:#047857; }
  .tag.tag-pay{ background:var(--blue-soft); color:#1d4ed8; }
  .tag.tag-corp{ background:var(--rose-soft); color:#be123c; }
  .tag.tag-indiv{ background:var(--violet-soft); color:#6d28d9; }
  .tag.tag-corp-type{ background:var(--primary-soft); color:var(--primary-dark); }
  .tag.tag-indiv-type{ background:var(--mint-soft); color:#047857; }

  .due-overdue{ color:var(--rose); font-weight:800; }
  .due-soon{ color:var(--amber); font-weight:800; }

  .steps{ display:flex; gap:5px; flex-wrap:wrap; }
  .step-chip{
    font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px;
    background:var(--bg); color:var(--muted); cursor:pointer;
    border:1px solid var(--border); white-space:nowrap; transition:all .12s;
  }
  .step-chip.done.tone-corp{ background:var(--rose-soft); color:#be123c; border-color:transparent; }
  .step-chip.done.tone-indiv{ background:var(--violet-soft); color:#6d28d9; border-color:transparent; }

  .small-input{ width:110px; }

  .task-list{ list-style:none; margin:0; padding:0; }
  .task-list li{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .task-list li:last-child{ border-bottom:none; }
  .task-list input[type=checkbox]{
    width:18px; height:18px; accent-color:var(--primary); cursor:pointer;
  }
  .task-list .task-date{ font-size:11.5px; color:var(--muted); min-width:82px; font-weight:700; }
  .task-list .task-text{ flex:1; }
  .task-list li.done .task-text{ text-decoration:line-through; color:var(--muted); }

  /* ===== To do: 연속 스크롤 아젠다(네이버 할일 스타일) ===== */
  .wl-agenda{
    max-height:620px;
    overflow-y:auto;
    border:1px solid var(--border);
    border-radius:14px;
    padding:0 16px;
    background:var(--bg);
  }
  .wl-day{ padding:6px 0 4px; }
  .wl-day-head{
    position:sticky; top:0; z-index:2;
    background:var(--bg);
    padding:10px 0 6px;
    font-size:12.5px; font-weight:800; color:var(--muted);
  }
  .wl-day-head.today{ color:var(--primary-dark); }
  .wl-day .task-list{ margin:0; }
  .wl-daynav{ display:flex; align-items:center; justify-content:center; gap:14px; margin:14px 0 10px; }
  .wl-daynav-label{ font-size:16px; font-weight:800; min-width:190px; text-align:center; }
  .wl-rel{ display:inline-block; margin-left:6px; padding:2px 9px; border-radius:999px; font-size:11px; background:var(--slate-soft); color:var(--muted); vertical-align:middle; }
  .wl-rel.today{ background:var(--primary-soft); color:var(--primary-dark); }
  .wl-carry{ border:1px solid var(--amber-soft); background:#fffaf0; border-radius:14px; padding:10px 14px; margin-bottom:12px; }
  .wl-carry-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:13px; }
  .wl-carry .task-list li{ padding:8px 0; }
  .wl-moved{ display:inline-block; margin-left:6px; padding:1px 7px; border-radius:999px; font-size:10.5px; font-weight:700; background:var(--amber-soft); color:#b45309; }
  .wl-day .task-list li{ padding:8px 0; }

  .deadline-list{ list-style:none; margin:0; padding:0; }
  .deadline-list li{ display:flex; align-items:center; gap:10px; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .deadline-list li:last-child{ border-bottom:none; }
  .deadline-list .left{ display:flex; align-items:center; gap:10px; }

  .empty{ text-align:center; color:var(--muted); padding:30px 0; font-size:13px; }

  .type-tag{ font-size:11px; padding:3px 9px; border-radius:999px; background:var(--bg); color:var(--muted); font-weight:700; }

  .date-cell{ display:flex; align-items:center; gap:6px; }
  .date-cell input[type=date]{ width:132px; padding:6px 8px; font-size:12px; }
  button.btn.xs{ padding:5px 10px; font-size:11px; }
  button.btn:disabled{ opacity:.35; cursor:default; }
  .step-date{ display:block; font-size:9.5px; font-weight:600; opacity:.75; margin-top:1px; }

  .settings-card{ max-width:820px; margin-left:auto; margin-right:auto; }
  .settings-block{
    padding:16px 18px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:14px;
    margin-bottom:12px;
  }
  .settings-block:last-child{ margin-bottom:0; }
  .settings-block .row{ display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; }
  .settings-block h3{ font-size:13.5px; font-weight:800; margin-bottom:3px; }
  .settings-block .hint{ font-size:12px; color:var(--muted); line-height:1.5; max-width:420px; }
  .settings-block .ctrl{ display:flex; align-items:center; gap:8px; flex-shrink:0; }

  .cal-title-row{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; margin-bottom:16px; }
  .cal-title{ justify-self:center; margin:0; }
  .cal-title-row button{ justify-self:end; }
  .cal-head{ display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:14px; }
  .cal-head .month-label{ font-size:15px; font-weight:800; min-width:110px; text-align:center; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:92px; gap:6px; }
  .cal-dow{ text-align:center; font-size:11px; font-weight:800; color:var(--muted-soft); padding:2px 0 8px; text-transform:uppercase; }
  .cal-day{
    position:relative; height:92px; overflow:hidden;
    border-radius:12px; background:var(--bg);
    padding:7px 7px 8px; border:1px solid transparent;
  }
  .cal-day.other{ opacity:.4; }
  .cal-day.today{ border-color:var(--primary); background:var(--primary-soft); }
  .cal-daynum{ font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:5px; }
  .cal-day.today .cal-daynum{ color:var(--primary-dark); }
  .cal-tasks{ display:flex; flex-direction:column; gap:3px; overflow:hidden; max-height:60px; }
  .cal-task{
    font-size:10.5px; font-weight:700; background:var(--card); color:var(--text);
    padding:3px 6px; border-radius:6px; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    box-shadow:var(--shadow-sm); flex-shrink:0;
  }
  .cal-task.cal-deadline{ cursor:default; box-shadow:none; }
  .cal-task.cd-vat{ background:var(--mint-soft); color:#047857; }
  .cal-task.cd-pay{ background:var(--blue-soft); color:#1d4ed8; }
  .cal-task.cd-corp{ background:var(--rose-soft); color:#be123c; }
  .cal-task.cd-indiv{ background:var(--violet-soft); color:#6d28d9; }
  .cal-task.cd-etc{ background:var(--amber-soft); color:#b45309; }
  .cal-task.cal-event{ background:var(--primary); color:#fff; }
  .cal-task.done{ text-decoration:line-through; color:var(--muted); background:var(--bg); box-shadow:none; }

  /* ===== 로그인 게이트 ===== */
  #authGate{
    position:fixed; inset:0; z-index:1000;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#fff8f0,#f1f1fb);
  }
  #authGate .gate-card{
    background:var(--card);
    border-radius:24px;
    box-shadow:var(--shadow-md);
    padding:40px 36px;
    max-width:340px;
    width:90%;
    text-align:center;
  }
  #authGate .gate-title{
    font-family:'Fraunces', Georgia, serif;
    font-style:italic;
    font-size:22px;
    font-weight:600;
    margin-bottom:6px;
  }
  #authGate .gate-desc{
    color:var(--muted);
    font-size:12.5px;
    margin-bottom:22px;
    line-height:1.6;
  }
  #authGate .gate-btn-wrap{
    display:flex; justify-content:center; margin-bottom:14px;
    min-height:42px;
  }
  #authGate .gate-error{
    color:var(--rose);
    font-size:12.5px;
    font-weight:700;
    margin-top:10px;
    display:none;
  }
  #authGate .gate-error.show{ display:block; }
  /* ===== 가독성 보정 (2026-09-28): 글자·테두리 대비를 높이고 작은 글씨를 키움 ===== */
  :root{
    --bg:#f5edf1;
    --border:#ead6df;
    --text:#2a1d26;
    --muted:#6d5a66;
    --muted-soft:#8f7b87;
    /* 메인 컬러: 분홍 */
    --primary:#ec7ba6;
    --primary-dark:#c7527f;
    --primary-soft:#fdebf2;
    --shadow-sm: 0 1px 3px rgba(33,31,61,.10);
    --shadow-md: 0 2px 4px rgba(33,31,61,.08), 0 10px 24px -8px rgba(33,31,61,.18);
  }
  body{ font-size:15px; }
  header{ box-shadow:0 1px 0 var(--border); }
  header .today-pill{ font-size:13.5px; font-weight:700; color:var(--text); background:var(--primary-soft); }

  .nav-item{ border:1px solid var(--border); color:var(--slate); }
  .nav-item .tiny{ font-size:12px; }
  .nav-item.active{ background:var(--primary); color:#fff; border-color:var(--primary); }

  .card{ border-color:var(--border); box-shadow:var(--shadow-md); }
  .card h2{ font-size:17px; }
  .card .desc{ font-size:13.5px; color:var(--muted); }
  .page-head .subtitle{ font-size:14px; }

  select, input[type=text], input[type=date], input[type=number]{ font-size:14px; border:1px solid var(--border); background:#fff; color:var(--text); }
  button.btn{ font-size:13.5px; border:1px solid var(--border); color:var(--text); }
  button.btn.xs{ font-size:12.5px; padding:6px 11px; }
  button.btn.ghost{ color:var(--slate); }
  button.btn.primary{ color:#fff; }

  th{ color:var(--muted); font-size:12.5px; }
  table{ font-size:14px; }
  .tag, .pill, .type-tag{ font-size:12.5px; }
  .task-list .task-date{ font-size:13px; color:var(--slate); }
  .empty{ font-size:14px; }
  .stat .label, .hero-tile .label{ font-size:13px; }

  /* 달력: 요일 줄 빈 공간 제거, 칸을 흰색+테두리로 구분 */
  .cal-head .month-label{ font-size:18px; }
  .cal-grid{ grid-template-rows:auto; grid-auto-rows:minmax(108px, auto); gap:6px; }
  .cal-dow{ font-size:13.5px; color:var(--slate); padding:4px 0 6px; }
  .cal-dow:nth-child(1){ color:#e11d48; }
  .cal-dow:nth-child(7){ color:#2563eb; }
  .cal-day{ background:#fff; border:1px solid var(--border); height:auto; min-height:108px; }
  .cal-day.other{ opacity:1; background:#f7f1f4; }
  .cal-day.other .cal-daynum{ color:#c3b2bc; }
  .cal-day.today{ border:2px solid var(--primary); background:#fff4f8; }
  .cal-daynum{ font-size:13.5px; color:var(--text); }
  .cal-grid > .cal-day:nth-child(7n+1) .cal-daynum{ color:#e11d48; }
  .cal-grid > .cal-day:nth-child(7n) .cal-daynum{ color:#2563eb; }
  .cal-day.today .cal-daynum{ color:var(--primary-dark); }
  .cal-grid > .cal-day.other .cal-daynum{ color:#c3b2bc; }
  .cal-tasks{ max-height:none; }
  .cal-task{ font-size:12px; padding:4px 7px; }
  .cal-task.cd-vat{ background:#d1fae5; color:#065f46; }
  .cal-task.cd-pay{ background:#dbeafe; color:#1e40af; }
  .cal-task.cd-corp{ background:#ffe4e6; color:#9f1239; }
  .cal-task.cd-indiv{ background:#ede9fe; color:#5b21b6; }
  .cal-task.cd-etc{ background:#fef3c7; color:#92400e; }

  /* To do */
  .wl-agenda{ background:#fff; }
  .wl-day-head{ background:#fff; font-size:13.5px; color:var(--slate); }
  .wl-daynav-label{ font-size:18px; }
  .wl-rel{ font-size:12px; }
  .wl-moved{ font-size:11.5px; }
  .task-list li{ border-bottom-color:var(--border); }

  /* ===== To do 상단 체크리스트: 공지 카드 스타일 ===== */
  .notice-card{
    max-width:760px; margin:0 auto 22px;
    background:linear-gradient(180deg,#fffaf0 0%,#ffffff 70%);
    border:1px solid #f3e3c3; border-top:5px solid #f5b544;
    border-radius:var(--radius-lg);
    padding:22px 28px 20px;
    box-shadow:var(--shadow-md);
  }
  .notice-title{ text-align:center; font-size:22px; font-weight:800; letter-spacing:-.3px; color:var(--text); }
  .notice-months{ display:flex; justify-content:center; align-items:center; gap:6px; margin:10px 0 12px; flex-wrap:wrap; }
  .notice-month{
    font-family:inherit; font-size:13px; font-weight:700; cursor:pointer;
    padding:5px 14px; border-radius:999px; border:1px solid #efd9ad; background:#fff; color:#8a5a00;
  }
  .notice-month.on{ background:#f5b544; border-color:#f5b544; color:#fff; }
  .notice-arrow{ border:none; background:transparent; color:#b7862b; cursor:pointer; font-size:12px; padding:4px 6px; }
  .notice-arrow:disabled{ opacity:.3; cursor:default; }
  .notice-progress{ height:6px; border-radius:999px; background:#f6ead2; overflow:hidden; max-width:320px; margin:0 auto; }
  .notice-progress span{ display:block; height:100%; background:#f5b544; border-radius:999px; transition:width .2s; }
  .notice-count{ text-align:center; font-size:12.5px; color:#8a5a00; font-weight:700; margin:6px 0 14px; }
  .notice-items{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px 10px; }
  .notice-item{
    display:flex; align-items:flex-start; gap:9px; cursor:pointer;
    background:#fff; border:1px solid #f1e4c8; border-radius:12px;
    padding:10px 12px; font-size:14px; line-height:1.4;
  }
  .notice-item:hover{ border-color:#f5b544; }
  .notice-item input{ margin-top:2px; accent-color:#f5b544; width:16px; height:16px; flex:none; }
  .notice-item.done{ background:#faf7f0; }
  .notice-item.done span{ text-decoration:line-through; color:var(--muted-soft); }
  .notice-sched{ margin-top:16px; padding-top:14px; border-top:1px dashed #efd9ad; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .notice-sched-label{ font-size:12.5px; font-weight:800; color:#8a5a00; margin-right:4px; }
  .notice-sched-chip{ font-size:12.5px; background:#fff3d6; color:#6b4500; padding:4px 10px; border-radius:999px; }
  @media (max-width:640px){ .notice-items{ grid-template-columns:1fr; } .notice-card{ padding:18px 16px; } }

  input[type=checkbox]{ accent-color:var(--primary); }
  .notice-item input{ accent-color:#f5b544; }

  /* To do: Today 헤더 */
  .today-title{ text-align:center; font-size:22px; font-weight:800; letter-spacing:-.3px; color:var(--text); margin-top:2px; }
  .wl-daynav{ margin:8px 0 14px; gap:10px; }
  .wl-navbtn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:#fff;
    color:var(--primary-dark); font-size:22px; line-height:1; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; padding:0 0 3px;
  }
  .wl-navbtn:hover{ background:var(--primary-soft); border-color:var(--primary); }
  .wl-daynav-label{ font-size:16px; color:var(--slate); }

  /* 홈 달력: 월 이동 + 연·월 선택 */
  .cal-head{ gap:12px; position:relative; }
  .cal-ym-wrap{ position:relative; }
  .cal-ym{
    font-family:inherit; font-size:19px; font-weight:800; color:var(--text);
    background:transparent; border:1px solid transparent; border-radius:12px; padding:6px 12px; cursor:pointer;
  }
  .cal-ym:hover{ background:var(--primary-soft); border-color:var(--border); }
  .cal-ym-caret{ font-size:12px; color:var(--primary); margin-left:2px; }
  .cal-today-btn{
    font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
    padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:#fff; color:var(--primary-dark);
  }
  .cal-today-btn:hover{ background:var(--primary-soft); }
  .cal-picker{
    position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); z-index:30;
    width:280px; background:#fff; border:1px solid var(--border); border-radius:16px;
    box-shadow:var(--shadow-md); padding:14px;
  }
  .cal-picker-year{ display:flex; align-items:center; justify-content:space-between; font-size:16px; font-weight:800; margin-bottom:12px; }
  .cal-picker-months{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .cal-pm{
    font-family:inherit; font-size:13.5px; font-weight:700; padding:9px 0; border-radius:10px; cursor:pointer;
    border:1px solid var(--border); background:#fff; color:var(--text);
  }
  .cal-pm:hover{ background:var(--primary-soft); }
  .cal-pm.now{ border-color:var(--primary); color:var(--primary-dark); }
  .cal-pm.on{ background:var(--primary); border-color:var(--primary); color:#fff; }

  /* 검색 아이콘 + 좁은 입력창 */
  .search-wrap{ position:relative; display:flex; align-items:center; justify-content:flex-end; }
  .search-wrap .search-input{ width:0; padding:0; border-width:0; opacity:0; transition:width .15s, opacity .15s; }
  .search-wrap.open .search-input{ width:210px; padding:8px 36px 8px 12px; border-width:1px; opacity:1; border-radius:999px; }
  .search-icon{
    position:absolute; right:4px; width:30px; height:30px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    border:none; background:transparent; color:var(--primary-dark); cursor:pointer;
  }
  .search-wrap:not(.open) .search-icon{ position:static; border:1px solid var(--border); background:#fff; }
  .search-icon:hover{ background:var(--primary-soft); }
  .search-icon.static{ cursor:default; background:transparent !important; }
  .notice-top{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
  .notice-top .search-wrap{ justify-self:end; }
  .notice-top .search-wrap.open .search-input{ width:170px; }
  .notice-ym{ font-size:16px; color:#8a5a00; }
  .notice-ym:hover{ background:#fff3d6; border-color:#efd9ad; }
  .notice-ym .cal-ym-caret{ color:#f5b544; }
  .notice-months .cal-pm.on{ background:#f5b544; border-color:#f5b544; }
  .cal-pm:disabled{ opacity:.35; cursor:default; background:#fff; }
  .notice-mtag{ display:inline-block; font-size:11px; font-weight:800; color:#8a5a00; background:#fff3d6; border-radius:999px; padding:1px 7px; margin-right:6px; }

  /* Google 미연결 안내 */
  .connect-banner{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    background:#fff; border:1px solid var(--border); border-left:4px solid var(--primary);
    border-radius:14px; padding:12px 16px; margin-bottom:18px; font-size:14px; box-shadow:var(--shadow-sm);
  }

  /* ===== 대메뉴: 플로팅 독(D) ===== */
  aside.sidebar{
    width:auto; margin:24px 0 0 16px; padding:10px 8px; gap:4px;
    background:#fff; border:1px solid var(--border); border-radius:26px;
    box-shadow:0 10px 24px -12px rgba(150,50,90,.35);
    top:16px;
  }
  .nav-item{
    width:64px; padding:8px 0 7px; gap:4px; border:none; border-radius:18px;
    background:transparent; box-shadow:none; color:var(--muted);
  }
  .nav-item .nav-ic{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s, color .15s, transform .15s;
  }
  .nav-item svg{ width:20px; height:20px; }
  .nav-item .tiny{ font-size:11.5px; }
  .nav-item:hover{ transform:none; box-shadow:none; color:var(--primary-dark); }
  .nav-item:hover .nav-ic{ background:var(--primary-soft); }
  .nav-item.active{ background:transparent; box-shadow:none; color:var(--primary-dark); border:none; }
  .nav-item.active .nav-ic{
    background:linear-gradient(135deg,#f5a3c2 0%,#f7c46e 100%); color:#fff;
    box-shadow:0 4px 10px -3px rgba(236,123,166,.6);
  }
  .nav-gutter{ width:210px; }
  .nav-flyout{ left:calc(100% + 12px); }

  .wl-date-pick{ position:relative; }
  .wl-daynav-label.cal-ym{ font-size:17px; min-width:0; }
  .wl-hidden-date{ position:absolute; left:50%; bottom:0; width:1px; height:1px; opacity:0; pointer-events:none; border:0; padding:0; }
  .wl-daynav{ position:relative; }
  #wlBackToday:empty{ display:none; }
  @media (max-width:760px){ #wlBackToday{ position:static; } }

  /* 상단 Sunmin's Works 줄 고정 */
  header{ position:sticky; top:0; z-index:60; }
  aside.sidebar{ top:84px; }

  button, input, select, textarea{ font-family:inherit; }

  /* 상단: 핑크 탭 + 흰 헤더 + 분홍 선 (A안) */
  header{ background:#fff; border-bottom:3px solid var(--primary); box-shadow:none; }
  header .wordmark{ color:var(--primary-dark); }
  header .today-pill{ background:var(--primary-soft); color:var(--primary-dark); }

  /* ===== 공통 팝업 B안 ===== */
  .sm-modal-backdrop{
    position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center;
    background:rgba(42,29,38,.42); padding:16px; opacity:0; transition:opacity .15s;
  }
  .sm-modal-backdrop.show{ opacity:1; }
  .sm-modal{
    width:100%; max-width:340px; background:#fff; border-radius:22px; padding:26px 22px 20px; text-align:center;
    box-shadow:0 24px 48px -12px rgba(0,0,0,.35); transform:translateY(8px) scale(.98); transition:transform .15s;
  }
  .sm-modal-backdrop.show .sm-modal{ transform:none; }
  .sm-modal-ic{
    width:52px; height:52px; border-radius:50%; margin:0 auto 12px;
    background:linear-gradient(135deg,#f5a3c2,#f7c46e); color:#fff; font-size:26px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .sm-modal.danger .sm-modal-ic{ background:linear-gradient(135deg,#f59aa8,#e2445c); }
  .sm-modal-title{ font-size:17px; font-weight:800; color:var(--text); margin-bottom:6px; line-height:1.4; word-break:keep-all; }
  .sm-modal-msg{ font-size:14px; color:var(--muted); line-height:1.55; margin-bottom:4px; word-break:keep-all; }
  .sm-modal-fields{ text-align:left; margin-top:12px; display:flex; flex-direction:column; gap:10px; }
  .sm-modal-field span{ display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:4px; }
  .sm-modal-field input{ width:100%; border-radius:12px; padding:10px 12px; }
  .sm-modal-btns{ display:flex; gap:8px; margin-top:20px; }
  .sm-modal-btns button{ flex:1; padding:12px 0; border-radius:12px; border:none; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; }
  .sm-modal-cancel{ background:#f3eef1; color:var(--muted); }
  .sm-modal-cancel:hover{ background:#ebe3e8; }
  .sm-modal-ok{ background:var(--primary); color:#fff; }
  .sm-modal-ok:hover{ background:var(--primary-dark); }
  .sm-modal.danger .sm-modal-ok{ background:#e2445c; }
  .sm-modal.danger .sm-modal-ok:hover{ background:#c7334a; }

  .cal-add-btn{ position:absolute; top:26px; right:24px; z-index:5; }
  .page-head .subtitle:empty{ display:none; }

  .nav-item svg{ overflow:visible; }

  /* Today: 왼쪽 위 '오늘' 버튼 */
  .notice-top > #wlTodayBtnSlot{ justify-self:start; }
  .wl-today-btn{
    font-family:inherit; font-size:13px; font-weight:700; cursor:pointer;
    padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:#fff; color:var(--primary-dark);
  }
  .wl-today-btn:hover{ background:var(--primary-soft); }
  .wl-today-btn.on{ background:var(--primary-soft); border-color:var(--primary-soft); cursor:default; }

  /* ===== 체크리스트 리디자인: 앱 테마(흰색+분홍)에 맞춘 깔끔한 목록형 ===== */
  .notice-card{
    background:#fff; border:1px solid var(--border); border-top:1px solid var(--border);
    border-radius:var(--radius-lg); box-shadow:var(--shadow-md); padding:22px 28px 20px;
  }
  .notice-title{ font-size:20px; }
  .notice-ym{ color:var(--primary-dark); font-size:15px; }
  .notice-ym:hover{ background:var(--primary-soft); border-color:var(--border); }
  .notice-months{ margin:6px 0 10px; }
  .notice-months .cal-pm.on{ background:var(--primary); border-color:var(--primary); }
  .notice-progress{ height:5px; background:var(--primary-soft); max-width:260px; }
  .notice-progress span{ background:linear-gradient(90deg,#f5a3c2,var(--primary)); }
  .notice-count{ color:var(--muted); font-weight:600; font-size:12.5px; margin:6px 0 12px; }
  .notice-items{ gap:0 28px; border-top:1px solid var(--border); }
  .notice-item{
    background:transparent; border:none; border-bottom:1px solid var(--border); border-radius:0;
    padding:11px 4px; font-size:14px; align-items:center;
  }
  .notice-item:hover{ background:#fdf7fa; border-color:var(--border); }
  .notice-item input{
    appearance:none; -webkit-appearance:none; margin:0; width:18px; height:18px; flex:none;
    border:1.8px solid #e3c3d2; border-radius:50%; background:#fff; cursor:pointer; position:relative;
  }
  .notice-item input:checked{ background:var(--primary); border-color:var(--primary); }
  .notice-item input:checked::after{
    content:''; position:absolute; left:5px; top:1.5px; width:4px; height:8px;
    border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg);
  }
  .notice-item.done{ background:transparent; }
  .notice-item.done span{ color:#b9a9b2; }
  .notice-mtag{ background:var(--primary-soft); color:var(--primary-dark); }
  .notice-sched{ border-top:none; margin-top:14px; padding-top:0; }
  .notice-sched-label{ color:var(--muted); }
  .notice-sched-chip{ background:#f7f1f4; color:var(--text); border:1px solid var(--border); }

  /* 홈 달력: 스크롤 없이 한 화면에 들어오도록 화면 높이에 맞춤 (칸 최소 90px) */
  .cal-grid{ grid-auto-rows:minmax(116px, auto); gap:8px; }
  .cal-day{ min-height:116px; }

  /* 거래처 관리 아이콘 */
  .cl-actions{ text-align:center; white-space:nowrap; }
  .icon-btn{ width:30px; height:30px; border-radius:8px; border:1px solid transparent; background:transparent; color:var(--muted);
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
  .icon-btn:hover{ background:var(--primary-soft); color:var(--primary-dark); }
  .icon-btn.danger:hover{ background:#ffe4e6; color:#e2445c; }
  .cl-edited{ color:var(--primary-dark); font-weight:700; border-bottom:1px dashed var(--primary); }
  .sm-modal.wide{ max-width:460px; }
  .sm-modal-field select{ width:100%; border-radius:12px; padding:10px 12px; }
  .sm-modal-html{ text-align:left; max-height:50vh; overflow:auto; }
  .cl-hist-meta{ font-size:12.5px; color:var(--muted); margin-bottom:10px; }
  .cl-hist-item{ border-top:1px solid var(--border); padding:9px 0; }
  .cl-hist-head{ display:flex; justify-content:space-between; font-size:13.5px; color:var(--text); }
  .cl-hist-head span{ color:var(--muted); font-size:12.5px; }
  .cl-hist-chg{ font-size:13px; color:var(--text); margin-top:3px; }
  .cl-hist-chg s{ color:var(--muted); }
  .cl-hist-empty{ color:var(--muted); font-size:13.5px; padding:8px 0; }

  /* 본문 가로폭 제한: 큰 모니터에서도 가운데 1460px 안에서만 보이게 (Tax.J 비율) */
  main .page-head, main .tab, main .connect-banner{ max-width:1460px; margin-left:auto; margin-right:auto; }

  /* 행 관리 아이콘 공통 */
  .row-actions{ display:inline-flex; gap:2px; flex:none; margin-left:auto; }
  .row-actions .icon-btn{ width:28px; height:28px; }
  .task-list li .row-actions{ opacity:0; transition:opacity .12s; }
  .task-list li:focus-within .row-actions{ opacity:1; }
  @media (hover:none){ .task-list li .row-actions, .notice-item .row-actions{ opacity:.7; } }   /* 휴대폰(마우스 없음)에서는 항상 보이게 */
  .task-list li:hover .row-actions{ opacity:1; }
  .notice-item{ align-items:center; cursor:default; }
  .notice-text{ flex:1; cursor:pointer; }
  .notice-item .row-actions{ opacity:0; transition:opacity .12s; }
  .notice-item:hover .row-actions{ opacity:1; }
  .notice-item .row-actions .icon-btn{ width:24px; height:24px; }
  .notice-item .row-actions svg{ width:14px; height:14px; }
  .notice-add{ margin-top:10px; font-family:inherit; font-size:13px; font-weight:700; color:var(--primary-dark);
    background:transparent; border:1px dashed var(--border); border-radius:10px; padding:8px 14px; cursor:pointer; width:100%; }
  .notice-add:hover{ background:var(--primary-soft); }
  .ev-actions{ display:flex; gap:8px; justify-content:center; margin-top:6px; }
  .ev-actions .btn{ display:inline-flex; align-items:center; gap:6px; }
  .ev-actions .btn.danger{ color:#e2445c; }

  /* 홈 요약 */
  .home-summary{ display:grid; grid-template-columns:repeat(3, 1fr) 2fr; gap:12px; margin-bottom:16px; }
  .hs-tile{ background:#fff; border:1px solid var(--border); border-radius:16px; padding:14px 18px; box-shadow:var(--shadow-sm); cursor:pointer; }
  .hs-tile:hover{ border-color:var(--primary); }
  .hs-tile.hs-wide{ cursor:default; }
  .hs-tile.hs-wide:hover{ border-color:var(--border); }
  .hs-n{ font-size:26px; font-weight:800; color:var(--primary-dark); line-height:1.1; }
  .hs-n span{ font-size:15px; color:var(--muted); font-weight:700; margin-left:2px; }
  .hs-tile.warn .hs-n{ color:#d97706; }
  .hs-l{ font-size:13px; color:var(--muted); font-weight:700; margin-top:4px; }
  .hs-dl{ display:flex; gap:10px; align-items:center; font-size:13.5px; padding:3px 0; }
  .hs-dl b{ min-width:52px; font-size:12px; color:var(--muted); background:#f7f1f4; border-radius:999px; text-align:center; padding:2px 8px; }
  .hs-dl b.soon{ color:#fff; background:var(--primary); }
  .hs-dl span{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hs-dl em{ font-style:normal; color:var(--muted); font-size:12.5px; }
  @media (max-width:900px){ .home-summary{ grid-template-columns:repeat(3, 1fr); } .hs-wide{ grid-column:1/-1; } }
  /* 거래처 모아보기 */
  .cl-name{ cursor:pointer; }
  .cl-name:hover{ color:var(--primary-dark); text-decoration:underline; }
  .cd-grid, .cd-tax{ display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; }
  .cd-tax{ grid-template-columns:repeat(3, 1fr); }
  .cd-grid div, .cd-tax div{ display:flex; flex-direction:column; font-size:13.5px; }
  .cd-grid span, .cd-tax span{ font-size:12px; color:var(--muted); }
  .cd-sec{ font-size:13px; font-weight:800; color:var(--primary-dark); margin:14px 0 6px; padding-top:10px; border-top:1px solid var(--border); }
  .cd-sec small{ font-weight:500; color:var(--muted); }
  .cd-task{ font-size:13.5px; padding:4px 0; display:flex; gap:8px; }
  .cd-task em{ font-style:normal; color:var(--muted); min-width:38px; }
  .cd-task.done{ color:var(--muted); text-decoration:line-through; }
  .cd-empty{ font-size:13px; color:var(--muted); }
  .sm-modal.wide{ max-width:520px; }
  /* 반복 할 일 */
  .rec-row{ display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .rec-row b{ min-width:72px; color:var(--primary-dark); }
  .rec-row span:not(.row-actions){ flex:1; }

  /* 분홍 버튼 글씨 가독성: 조금 더 진한 분홍 바탕 + 글씨 굵기 완화 */
  button.btn.primary{ background:var(--primary-dark); border-color:var(--primary-dark); font-weight:600; letter-spacing:.1px; }
  button.btn.primary:hover{ background:#b04571; border-color:#b04571; }

  /* 신고 탭: 거래처 목록과 같은 앞 3열 */
  .tx-seq{ width:56px; color:var(--muted); }
  .tx-type{ width:70px; }
  .tx-name{ min-width:160px; font-weight:600; }

  /* 거래처 표: Tax.J 기장거래처 형식 */
  .cl-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:6px; }
  .cl-count{ font-size:13px; font-weight:700; color:var(--primary-dark); background:var(--primary-soft); border-radius:999px; padding:2px 10px; margin-left:6px; vertical-align:middle; }
  .cl-taxtype.kj{ color:#4547c9; font-weight:700; }
  .cl-taxtype.sd{ color:#B45309; font-weight:700; }
  td.num{ text-align:right; font-variant-numeric:tabular-nums; }

  .cl-subtabs{ display:flex; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
  .cl-subtab{ font-family:inherit; font-size:15px; font-weight:800; border:none; background:transparent; color:var(--muted); padding:6px 12px; border-radius:10px; cursor:pointer; }
  .cl-subtab span{ font-size:12px; font-weight:700; background:#f3eef1; color:var(--muted); border-radius:999px; padding:1px 8px; margin-left:4px; }
  .cl-subtab.on{ color:var(--primary-dark); background:var(--primary-soft); }
  .cl-subtab.on span{ background:#fff; color:var(--primary-dark); }

  #tab-clients .table-scroll th, #tab-clients .table-scroll td{ text-align:center; }

  #tab-vat .table-scroll th, #tab-vat .table-scroll td,
  #tab-pay .table-scroll th, #tab-pay .table-scroll td,
  #tab-corp .table-scroll th, #tab-corp .table-scroll td,
  #tab-indiv .table-scroll th, #tab-indiv .table-scroll td{ text-align:center; }
  #tab-vat .table-scroll td input, #tab-vat .table-scroll td select,
  #tab-pay .table-scroll td input, #tab-pay .table-scroll td select,
  #tab-corp .table-scroll td input, #tab-corp .table-scroll td select,
  #tab-indiv .table-scroll td input, #tab-indiv .table-scroll td select{ text-align:center; }
  #tab-vat .date-cell, #tab-pay .date-cell, #tab-corp .date-cell, #tab-indiv .date-cell{ justify-content:center; }
  #tab-vat .steps, #tab-pay .steps, #tab-corp .steps, #tab-indiv .steps{ justify-content:center; }

  /* 우측 상단 단축 아이콘 (뒤로가기/홈/휴지통/퀵배포) */
  .quick-bar{
    position:fixed; top:78px; right:20px; z-index:70;
    display:flex; align-items:center; gap:8px;
    background:#fff; border:1px solid var(--border); border-radius:999px;
    padding:6px; box-shadow:0 10px 24px -12px rgba(150,50,90,.35);
  }
  .quick-btn{
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--muted); transition:background .15s, color .15s, transform .15s;
  }
  .quick-btn:hover{ background:var(--primary-soft); color:var(--primary-dark); transform:translateY(-1px); }
  .quick-btn.accent{ background:linear-gradient(135deg,#f5a3c2 0%,#f7c46e 100%); color:#fff; }
  .quick-btn.accent:hover{ filter:brightness(1.05); }
  @media (max-width:760px){
    .quick-bar{ top:auto; bottom:16px; right:16px; }
  }

</style>
</head>
<body>

<div id="authGate">
  <div class="gate-card">
    <div class="gate-title">Sunmin's Works</div>
    <div class="gate-desc">나만 쓰는 개인 업무 도구예요.<br>등록된 Google 계정으로만 열 수 있습니다.</div>
    <div class="gate-btn-wrap">

  </div>
</div>

<div id="appRoot" style="display:none;">
<header>
  <span></span>
  <span class="wordmark">Sunmin's Works</span>
  <span style="justify-self:end; display:flex; align-items:center; gap:8px;">
    <span class="pill warn" id="syncWarningBadge" style="display:none; cursor:pointer;" onclick="handleGoogleSignIn()" title="눌러서 다시 연결하기">⚠ 연동 끊김 · 다시 로그인</span>
    <button class="btn xs primary" id="installAppBtn" style="display:none;" onclick="installApp()" title="이 컴퓨터에 앱으로 설치">⬇ 앱 설치</button>
    <span class="today-pill" id="todayPill"></span>
  </span>
</header>

<div class="quick-bar" id="quickBar">
  <button class="quick-btn" onclick="goBackTab()" title="뒤로가기" aria-label="뒤로가기">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
  </button>
  <button class="quick-btn" onclick="switchTab('home')" title="홈" aria-label="홈">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
  </button>
  <button class="quick-btn" onclick="openTrashModal()" title="휴지통" aria-label="휴지통">

const ALLOWED_EMAILS = ['sunmin2040@gmail.com'];
const AUTH_STORAGE_KEY = 'sm_auth_verified_email';

function parseJwt(token){
  try{
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g,'+').replace(/_/g,'/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(jsonPayload);
  }catch(e){ return null; }
}

function showGateError(msg){
  const el = document.getElementById('gateError');
  if(!el) return;
  if(msg) el.textContent = msg;
  el.classList.add('show');
}

function unlockApp(){
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('appRoot').style.display = '';
  startAppAfterAuth();
}

function lockApp(){
  clearGoogleToken();
  try{ localStorage.removeItem(AUTH_STORAGE_KEY); }catch(e){}
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('authGate').style.display = 'flex';

// 게이트에서 "Google로 로그인"을 누르면, 신원 확인(이 계정이 맞는지)과 Google Sheets 연동용
// access token 발급을 한 번의 클릭으로 같이 처리한다. 예전에는 이 둘이 분리돼 있어서
// 게이트만 통과하고 설정 탭의 "Google Sheets 연동"은 따로 눌러야 했는데, 그러면 로그인했는데도
// 연동 버튼이 그대로 남아있는 것처럼 보이는 문제가 있었음.
async function fetchGoogleUserEmail(accessToken){
  try{
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: 'Bearer ' + accessToken },
    });
    if(!res.ok) return null;
    const info = await res.json();
    return info && info.email ? info.email : null;
  }catch(e){ return null; }
}

function gateSignIn(){
  if(!googleTokenClient){
    smAlert('Google에 연결할 수 없어요', '인터넷 연결을 확인하고 잠시 후 다시 시도해주세요.');
    return;
  }
  const btn = document.getElementById('gateSignInBtn');
  if(btn){ btn.disabled = true; btn.textContent = '로그인 중...'; }

  googleTokenClient.callback = async (resp) => {
    if(resp.error){
      if(btn){ btn.disabled = false; btn.textContent = 'Google로 로그인'; }
      showGateError('로그인에 실패했어요. 다시 시도해주세요.');
      return;
    }
    const accessToken = resp.access_token;
    const email = await fetchGoogleUserEmail(accessToken);

    if(!email || !ALLOWED_EMAILS.includes(email)){
      if(typeof google !== 'undefined' && google.accounts){
        google.accounts.oauth2.revoke(accessToken, () => {});
      }
      if(btn){ btn.disabled = false; btn.textContent = 'Google로 로그인'; }
      showGateError();
      return;
    }

    googleAccessToken = accessToken;
    gapi.client.setToken({ access_token: googleAccessToken });
    saveGoogleToken(resp);
    try{ localStorage.setItem(AUTH_STORAGE_KEY, email); }catch(e){}
    unlockApp();
    await afterGoogleSignIn(); // 같은 토큰으로 Sheets 연동까지 바로 진행 (자동 연동됨 표시)
  };
  let hintEmail = '';
  try{ hintEmail = localStorage.getItem(AUTH_STORAGE_KEY) || ''; }catch(e){}
  // 처음 한 번만 동의 화면이 나오고, 이후엔 계정만 확인하고 바로 넘어가도록 prompt를 비움
  googleTokenClient.requestAccessToken(hintEmail ? { prompt: '', hint: hintEmail } : { prompt: '' });
}

  // (예전처럼 저장된 이메일로 바로 통과시키면 데이터 연결 없이 기본 화면이 보이는 문제가 있었음)

// ── 로그인 유지: Google이 준 접속 토큰(약 1시간 유효)을 이 기기에 잠깐 보관해,
//    새로고침·배포 직후 다시 열어도 유효시간 안이면 로그인 없이 바로 이어서 열리게 함.
const GOOGLE_TOKEN_KEY = 'sm_google_token';
let resumeTried = false;
function saveGoogleToken(resp){
  try{
    const sec = Number(resp.expires_in) || 3600;
    localStorage.setItem(GOOGLE_TOKEN_KEY, JSON.stringify({ t: resp.access_token, exp: Date.now() + (sec - 120) * 1000 }));
  }catch(e){}
}
function clearGoogleToken(){ try{ localStorage.removeItem(GOOGLE_TOKEN_KEY); }catch(e){} }
function loadGoogleToken(){
  try{
    const v = JSON.parse(localStorage.getItem(GOOGLE_TOKEN_KEY) || 'null');
    if(v && v.t && v.exp > Date.now()) return v.t;
  }catch(e){}
  return null;
}
async function tryResumeSavedLogin(){
  if(resumeTried || !gapiReady) return;
  resumeTried = true;
  let email = null;
  try{ email = localStorage.getItem(AUTH_STORAGE_KEY); }catch(e){}
  const tok = loadGoogleToken();
  if(!tok || !email || !ALLOWED_EMAILS.includes(email)) return;
  googleAccessToken = tok;
  gapi.client.setToken({ access_token: tok });
  unlockApp();
  await afterGoogleSignIn();
}

function restoreFromTrash(trashId){
  const idx = trashBin.findIndex(x => x.id === trashId);
  if(idx < 0) return;
  const item = trashBin[idx];
  if(item.kind === 'client'){
    if(!clients.some(c => c.id === item.data.id)) clients.push(item.data);
  } else if(item.kind === 'task'){
    if(!tasks.some(t => t.id === item.data.id)) tasks.push(item.data);
  } else if(item.kind === 'checklist'){
    const m = item.extra && item.extra.month;
    if(m){ worklistChecklist[m] = worklistChecklist[m] || []; worklistChecklist[m].push(item.data); }

// 달력에 표시할 신고기한: 각 신고 탭의 기한 + To do '주요 세무일정' 중 날짜(예: 7/10)가 적힌 항목
function calendarDeadlines(){
  const list = [];
  const seen = new Set();
  const push = (date, domain, label) => {
    if(!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
    const key = date + '|' + label;
    if(seen.has(key)) return;
    seen.add(key);
    list.push({date, domain, label});
  };
  Object.entries(vatDue || {}).forEach(([k, d]) => push(d, '부가가치세', `${k} 부가세 신고기한`));
  Object.entries(payDue || {}).forEach(([k, d]) => {
    // "8월" + 기한 2026-09-10 → 2026년 8월 귀속 (12월분처럼 기한이 다음 해면 한 해 앞)
    const mo = parseInt(k, 10);
    let yr = d ? parseInt(d.slice(0, 4), 10) : new Date().getFullYear();
    if(d && !isNaN(mo) && mo > parseInt(d.slice(5, 7), 10)) yr -= 1;
    push(d, '원천세·급여', isNaN(mo) ? `${k} 원천세 신고기한` : `${yr}년 ${mo}월 귀속 원천세 신고기한`);
  });
  Object.entries(corpDue || {}).forEach(([k, d]) => push(d, '법인세', `${k}년 귀속 법인세 신고기한`));
  Object.entries(indivDue || {}).forEach(([k, d]) => push(d, '종합소득세', `${k}년 귀속 종소세 신고기한`));
  // 주요 세무일정: "7/27 부가가치세 확정신고" 처럼 앞에 월/일이 있는 것만
  const baseYear = calYear;
  Object.values(worklistSchedule || {}).forEach(arr => (arr || []).forEach(txt => {
    const m = /^\s*(\d{1,2})\s*[\/.]\s*(\d{1,2})\s*(.*)$/.exec(txt);
    if(!m) return;
    const mo = parseInt(m[1], 10), da = parseInt(m[2], 10);
    if(mo < 1 || mo > 12 || da < 1 || da > 31) return;
    push(`${baseYear}-${pad2(mo)}-${pad2(da)}`, '세무일정', (m[3] || '').trim() || txt);
  }));
  return list;
}

const CAL_DEADLINE_CLASS = {
  '부가가치세':'cd-vat', '원천세·급여':'cd-pay', '법인세':'cd-corp', '종합소득세':'cd-indiv', '세무일정':'cd-etc',

function renderCalendar(){
  const first = new Date(calYear, calMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();
  const todayS = todayStr();

  const cells = [];
  for(let i = 0; i < startDow; i++){
    const d = daysInPrevMonth - startDow + 1 + i;
    let y = calYear, m = calMonth - 1;
    if(m < 0){ m = 11; y--; }
    cells.push({ d, dateStr: `${y}-${pad2(m+1)}-${pad2(d)}`, other:true });
  }
  for(let d = 1; d <= daysInMonth; d++){
    cells.push({ d, dateStr: `${calYear}-${pad2(calMonth+1)}-${pad2(d)}`, other:false });
  }
  let nextDay = 1;
  while(cells.length % 7 !== 0){
    let y = calYear, m = calMonth + 1;
    if(m > 11){ m = 0; y++; }
    cells.push({ d: nextDay, dateStr: `${y}-${pad2(m+1)}-${pad2(nextDay)}`, other:true });
    nextDay++;
  }

  const dow = ['일','월','화','수','목','금','토'];
  const deadlinesAll = calendarDeadlines();

  return `
    <div class="cal-head">
      <button class="wl-navbtn" onclick="calPrev()" title="이전 달" aria-label="이전 달">‹</button>
      <div class="cal-ym-wrap">
        <button class="cal-ym" onclick="toggleCalPicker(event)" title="눌러서 연·월 선택">${calYear}년 ${calMonth+1}월</button>
        ${calPickerOpen ? `
        <div class="cal-picker" onclick="event.stopPropagation()">
          <div class="cal-picker-year">
            <button class="wl-navbtn" onclick="calPickerYear += -1; renderHome();" aria-label="이전 해">‹</button>
            <span>${calPickerYear}년</span>
            <button class="wl-navbtn" onclick="calPickerYear += 1; renderHome();" aria-label="다음 해">›</button>
          </div>
          <div class="cal-picker-months">
            ${Array.from({length:12}, (_, i) => {
              const isSel = calPickerYear === calYear && i === calMonth;
              const t = new Date();
              const isNow = calPickerYear === t.getFullYear() && i === t.getMonth();
              return `<button class="cal-pm ${isSel ? 'on' : ''} ${isNow ? 'now' : ''}" onclick="calPickMonth(${i})">${i+1}월</button>`;
            }).join('')}
          </div>
        </div>` : ''}
      </div>
      <button class="wl-navbtn" onclick="calNext()" title="다음 달" aria-label="다음 달">›</button>
    </div>
    <div class="cal-grid">
      ${dow.map(x => `<div class="cal-dow">${x}</div>`).join('')}
      ${cells.map(c => {
        const dayDeadlines = deadlinesAll.filter(x => x.date === c.dateStr);
        const dayEvents = events.filter(x => x.date === c.dateStr);
        return `
        <div class="cal-day ${c.dateStr===todayS?'today':''} ${c.other?'other':''}">
          <div class="cal-daynum">${c.d}</div>
          <div class="cal-tasks">
            ${dayDeadlines.map(x => `<div class="cal-task cal-deadline ${CAL_DEADLINE_CLASS[x.domain] || ''}" title="${x.label}">${x.label}</div>`).join('')}
            ${dayEvents.map(ev => `<div class="cal-task cal-event" onclick="openEvent(${ev.id})" title="${ev.text} (눌러서 수정·이력·삭제)">★ ${ev.text}</div>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}

// 반복 할 일: settings.recurring = [{id, day, text}] → 이번 달·다음 달 해당 날짜에 할 일을 자동 생성
function generateRecurringTasks(){
  const rules = settings.recurring || [];
  if(!rules.length || !sheetLoadedOnce) return;
  const made = new Set(settings.recurringMade || []);
  const now = new Date();
  let added = false;
  [0, 1].forEach(off => {
    const y = now.getFullYear(), m = now.getMonth() + off;
    const first = new Date(y, m, 1), last = new Date(y, m + 1, 0).getDate();
    const ym = `${first.getFullYear()}-${pad2(first.getMonth() + 1)}`;
    rules.forEach(r => {
      const key = `${r.id}|${ym}`;
      if(made.has(key)) return;
      const date = `${ym}-${pad2(Math.min(r.day, last))}`;
      if(date < todayStr() && !(r.since && r.since <= date)){ made.add(key); return; }   // 등록하기 전에 지나간 날짜는 만들지 않음
      const t = { id: nextTaskId++, date, text: r.text, done:false, recurring: r.id };
      pushHist(t, '반복 할 일로 자동 추가');
      tasks.push(t); made.add(key); added = true;
    });
  });
  if(added){ settings.recurringMade = [...made]; scheduleGoogleSave(); }
}

function daysBetween(a, b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
function renderHomeSummary(){
  const T = todayStr();
  const weekEnd = addDaysStr(T, 6 - new Date().getDay());          // 이번 주 토요일까지
  const todayTasks = tasks.filter(t => t.date === T);
  const todayLeft = todayTasks.filter(t => !t.done).length;
  const weekLeft = tasks.filter(t => !t.done && t.date > T && t.date <= weekEnd).length;
  const overdue = carryCandidates().length;
  const upcoming = calendarDeadlines().filter(d => d.date >= T).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 3);
  const evSoon = events.filter(e => e.date >= T && e.date <= addDaysStr(T, 7)).sort((a, b) => a.date.localeCompare(b.date));
  const dd = d => { const n = daysBetween(T, d); return n === 0 ? 'D-DAY' : `D-${n}`; };
  return `
    <div class="home-summary">
      <div class="hs-tile" onclick="switchTab('worklist')">
        <div class="hs-n">${todayLeft}<span>/${todayTasks.length}</span></div><div class="hs-l">오늘 남은 할 일</div>

      <div class="hs-tile" onclick="switchTab('worklist')">

      </div>
      <div class="hs-tile ${overdue ? 'warn' : ''}" onclick="switchTab('worklist')">

      </div>
      <div class="hs-tile hs-wide">
        <div class="hs-l" style="margin-bottom:6px;">다가오는 신고기한 · 일정</div>
        ${upcoming.concat(evSoon.map(e => ({ date:e.date, label:'★ ' + e.text }))).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 4)
          .map(d => `<div class="hs-dl"><b class="${daysBetween(T, d.date) <= (settings.soonDays || 7) ? 'soon' : ''}">${dd(d.date)}</b><span>${d.label}</span><em>${shortDate(d.date)}</em></div>`).join('')

const UPLOAD_XLSX_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12"/><path d="M7 11l5 5 5-5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>';
function checklistYear(){ return new Date().getFullYear(); }
function selectWorklistMonth(m){
  if(!m) return;
  worklistSelMonth = m;
  chkPickerOpen = false;
  renderWorklist();
}
function toggleChkPicker(e){ if(e) e.stopPropagation(); chkPickerOpen = !chkPickerOpen; renderWorklist(); }
document.addEventListener('click', () => { if(chkPickerOpen){ chkPickerOpen = false; renderWorklist(); } });

function toggleChecklistSearch(){
  if(checklistSearchOpen && checklistSearch){ closeChecklistSearch(); return; }
  checklistSearchOpen = !checklistSearchOpen;
  renderWorklist();
  if(checklistSearchOpen){ const i = document.getElementById('checklistSearch'); if(i) i.focus(); }
}
function closeChecklistSearch(){ checklistSearch = ''; checklistSearchOpen = false; renderWorklist(); }
function onChecklistSearch(v){
  checklistSearch = v;
  const box = document.getElementById('noticeItems');
  if(!box) return;
  if(v.trim()) box.innerHTML = checklistSearchHtml();
  else renderWorklist(), (document.getElementById('checklistSearch') || {}).focus?.();
}
// 모든 달의 체크리스트에서 검색
function checklistSearchHtml(){
  const q = checklistSearch.trim().toLowerCase();
  const out = [];
  Object.keys(worklistChecklist).forEach(mm => (worklistChecklist[mm] || []).forEach((item, idx) => {
    if((item.text || '').toLowerCase().includes(q)) out.push({mm, idx, item});
  }));
  if(!out.length) return `<div class="empty" style="grid-column:1/-1; padding:10px 0;">"${escapeAttr(checklistSearch)}" 검색 결과가 없어요.</div>`;
  return out.map(({mm, idx, item}) => `
    <div class="notice-item ${item.done ? 'done' : ''}">
      <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleWorklistCheck('${mm}', ${idx})">
      <span class="notice-text"><b class="notice-mtag">${mm}</b>${item.text}</span>
      ${actionIcons(`editChecklistItem('${mm}', ${idx})`, `showChecklistHistory('${mm}', ${idx})`, `deleteChecklistItem('${mm}', ${idx})`)}
    </div>`).join('');
}

function toggleWorklistCheck(month, idx){
  const item = worklistChecklist[month] && worklistChecklist[month][idx];
  if(item){ item.done = !item.done; pushHist(item, item.done ? '완료' : '완료 취소'); }
  renderAll();
}
async function editChecklistItem(month, idx){
  const item = worklistChecklist[month] && worklistChecklist[month][idx];
  if(!item) return;
  const r = await smForm('체크리스트 수정', [{ label:`${month} 항목`, value:item.text }], { okText:'저장', icon:'✎', wide:true });
  if(!r) return;
  const text = (r[0] || '').trim();
  if(!text || text === item.text) return;
  if(!item.origText && item.source !== 'user'){ item.origText = item.text; hideMasterKey('hiddenMasterChecklist', month + '|' + item.text); }
  pushHist(item, '수정', [{ label:'내용', from:item.text, to:text }]);
  item.text = text;
  renderAll();
}
function showChecklistHistory(month, idx){
  const item = worklistChecklist[month] && worklistChecklist[month][idx];
  if(!item) return;
  showHistoryModal('체크리스트 이력', item.history, `${month} · ${item.text}`);
}
async function deleteChecklistItem(month, idx){
  const item = worklistChecklist[month] && worklistChecklist[month][idx];
  if(!item) return;
  if(!(await smConfirm('이 항목을 삭제할까요?', item.text, { tone:'danger', icon:'!', okText:'삭제' }))) return;
  if(item.source !== 'user') hideMasterKey('hiddenMasterChecklist', month + '|' + (item.origText || item.text));
  moveToTrash('checklist', item.text, item, { month });
  worklistChecklist[month].splice(idx, 1);
  renderAll();
}
async function addChecklistItem(month){
  const r = await smForm(`${month} 체크리스트 추가`, [{ label:'항목', placeholder:'예: 부가세 안내문 발송' }], { okText:'추가', wide:true });
  if(!r || !(r[0] || '').trim()) return;
  const item = { text: r[0].trim(), done:false, source:'user' };
  pushHist(item, '추가');
  (worklistChecklist[month] = worklistChecklist[month] || []).push(item);
  renderAll();
}

function scrollToWorklistDate(dateStr){
  if(dateStr){ setWorklistDay(dateStr); return; }
  const container = document.getElementById('worklistAgenda');
  if(!container || !dateStr) return;
  let target = document.getElementById('wl-day-' + dateStr);
  if(!target){
    const days = Array.from(container.querySelectorAll('.wl-day'));
    target = days.find(d => d.id.replace('wl-day-','') >= dateStr) || days[days.length - 1];
  }
  if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
}
function jumpToWorklistDate(){
  const val = document.getElementById('worklistJumpDate').value;
  scrollToWorklistDate(val);
}
function jumpToWorklistToday(){ scrollToWorklistDate(todayStr()); }

const WL_DOW = ['일','월','화','수','목','금','토'];
function worklistDayLabel(dateStr){
  const d = new Date(dateStr);
  return `${dateStr} (${WL_DOW[d.getDay()]})`;
}

function renderWorklist(){
  const el = document.getElementById('tab-worklist');
  const monthNum = k => { const n = parseInt(k, 10); return isNaN(n) ? 99 : n; };
  const months = Array.from(new Set([...Object.keys(worklistChecklist), ...Object.keys(worklistSchedule)]))
    .sort((a, b) => monthNum(a) - monthNum(b));
  if(!worklistSelMonth || !months.includes(worklistSelMonth)){
    const cur = `${new Date().getMonth() + 1}월`;
    worklistSelMonth = months.includes(cur) ? cur : (months[months.length - 1] || null);
  }
  const selIdx = months.indexOf(worklistSelMonth);

  const refSections = months.length ? [worklistSelMonth].map(m => {
    const items = worklistChecklist[m] || [];
    const doneN = items.filter(x => x.done).length;
    const sched = worklistSchedule[m] || [];
    return `
    <div class="notice-card">
      <div class="notice-top">
        <span></span>
        <div class="notice-title">체크리스트</div>
        <div style="display:flex; align-items:center; gap:6px; justify-self:end;">
          <button class="icon-btn" onclick="document.getElementById('worklistXlsxInput').click()" title="엑셀로 가져오기" aria-label="엑셀로 가져오기">${UPLOAD_XLSX_SVG}</button>
          <div class="search-wrap ${checklistSearchOpen || checklistSearch ? 'open' : ''}">
            <input type="text" id="checklistSearch" class="search-input" placeholder="체크리스트 검색" value="${escapeAttr(checklistSearch)}" oninput="onChecklistSearch(this.value)" onkeydown="if(event.key==='Escape'){ closeChecklistSearch(); }">
            <button class="search-icon" onclick="toggleChecklistSearch()" title="체크리스트 검색" aria-label="체크리스트 검색">${SEARCH_SVG}</button>
          </div>
        </div>
      </div>
      <div class="notice-months">
        <div class="cal-ym-wrap">
          <button class="cal-ym notice-ym" onclick="toggleChkPicker(event)" title="눌러서 다른 달 보기">${checklistYear()}년 ${m}</button>
          ${chkPickerOpen ? `
          <div class="cal-picker" onclick="event.stopPropagation()">
            <div class="cal-picker-year" style="justify-content:center;"><span>${checklistYear()}년</span></div>
            <div class="cal-picker-months">
              ${Array.from({length:12}, (_, i) => {
                const key = `${i+1}월`;
                const has = months.includes(key);
                return `<button class="cal-pm ${key === m ? 'on' : ''}" ${has ? `onclick="selectWorklistMonth('${key}')"` : 'disabled'}>${i+1}월</button>`;
              }).join('')}
            </div>
          </div>` : ''}
        </div>
      </div>
      ${items.length ? `<div class="notice-progress"><span style="width:${Math.round(doneN / items.length * 100)}%"></span></div>
      <div class="notice-count">${doneN} / ${items.length} 완료</div>` : ''}
      <div class="notice-items" id="noticeItems">
        ${checklistSearch.trim() ? checklistSearchHtml() : items.map((item, idx) => `
          <div class="notice-item ${item.done ? 'done' : ''}">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleWorklistCheck('${m}', ${idx})">
            <span class="notice-text" onclick="toggleWorklistCheck('${m}', ${idx})">${item.text}</span>
            ${actionIcons(`editChecklistItem('${m}', ${idx})`, `showChecklistHistory('${m}', ${idx})`, `deleteChecklistItem('${m}', ${idx})`)}
          </div>`).join('') || '<div class="empty" style="padding:10px 0;">이 달의 체크리스트가 없어요.</div>'}
      </div>
      ${checklistSearch.trim() ? '' : `<button class="notice-add" onclick="addChecklistItem('${m}')">+ 항목 추가</button>`}
      ${sched.length ? `
        <div class="notice-sched">
          <div class="notice-sched-label">주요 세무일정</div>
          ${sched.map(x => `<span class="notice-sched-chip">${x}</span>`).join('')}
        </div>` : ''}
    </div>`;
  }).join('') : '';

  const todayS = todayStr();
  if(!worklistViewDate) worklistViewDate = todayS;

  el.innerHTML = `
    ${refSections}
    <div class="card">
      <div class="notice-top">
        <span id="wlTodayBtnSlot"></span>
        <div class="today-title">Today</div>
        <div style="display:flex; align-items:center; gap:6px; justify-self:end;">
          <button class="icon-btn" onclick="document.getElementById('worklistXlsxInput').click()" title="엑셀로 가져오기" aria-label="엑셀로 가져오기">${UPLOAD_XLSX_SVG}</button>
          <div class="search-wrap open">
            <input type="text" id="worklistSearch" class="search-input" placeholder="할 일 검색" value="${escapeAttr(worklistSearch)}" oninput="onWorklistSearch(this.value)" onkeydown="if(event.key==='Escape'){ this.value=''; onWorklistSearch(''); }">
            <span class="search-icon static" aria-hidden="true">${SEARCH_SVG}</span>

        </div>

      <input type="file" id="worklistXlsxInput" accept=".xlsx,.xls" style="display:none;" onchange="importWorklistExcel(this)">
      <div class="wl-daynav">

        <div class="wl-date-pick">
          <button class="wl-daynav-label cal-ym" id="wlDayLabel" onclick="openWorklistDatePicker()" title="눌러서 날짜 선택"></button>

        <button class="btn primary" onclick="addTask()">추가</button>
      </div>
    </div>
  `;
  renderWorklistBody();
  bindWorklistSwipe();
}

/* ----- 날짜별 할 일: 하루씩 보기 / 검색 / 미완료 넘기기 ----- */
let worklistViewDate = null;
let worklistSearch = '';
let worklistCarryOpen = false;
const WL_CARRY_DAYS = 14;   // 오늘 기준 최근 며칠까지의 못한 일을 '넘기기' 대상으로 보여줄지

function escapeAttr(v){ return String(v || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function addDaysStr(dateStr, n){
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d + n);
  return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`;
}
function shortDate(dateStr){ const [, m, d] = dateStr.split('-'); return `${parseInt(m,10)}/${parseInt(d,10)}`; }

function setWorklistDay(dateStr){
  if(!dateStr) return;
  worklistViewDate = dateStr;
  worklistSearch = '';
  const s = document.getElementById('worklistSearch'); if(s) s.value = '';
  const j = document.getElementById('worklistJumpDate'); if(j) j.value = dateStr;
  const n = document.getElementById('newTaskDate'); if(n) n.value = dateStr;
  renderWorklistBody();
}
function openWorklistDatePicker(){
  const inp = document.getElementById('worklistJumpDate');
  if(!inp) return;
  try{ inp.showPicker(); }catch(e){ inp.focus(); inp.click(); }
}
function shiftWorklistDay(n){ setWorklistDay(addDaysStr(worklistViewDate || todayStr(), n)); }
function onWorklistSearch(v){ worklistSearch = v; renderWorklistBody(); }

function carryCandidates(){
  const todayS = todayStr();
  const from = addDaysStr(todayS, -WL_CARRY_DAYS);
  // 같은 내용이 오늘 이후 날짜에 이미 있으면(직접 다시 적어둔 경우) 제외
  const ahead = new Set(tasks.filter(t => t.date >= todayS).map(t => (t.text || '').trim()));
  const seen = new Set();
  return tasks.filter(t => !t.done && t.date < todayS && t.date >= from)
              .sort((a, b) => b.date.localeCompare(a.date))
              .filter(t => { const k = (t.text || '').trim(); if(ahead.has(k) || seen.has(k)) return false; seen.add(k); return true; })
              .sort((a, b) => a.date.localeCompare(b.date));
}
// 못한 일을 오늘로 옮김. 원래 날짜는 movedFrom 에 남겨 '9/23에서 넘어옴' 으로 표시.
function carryTaskToToday(id){
  const t = tasks.find(x => x.id === id);
  if(!t) return;
  if(!t.movedFrom) t.movedFrom = t.date;
  if(t.source === 'master') t.source = 'moved';   // 마스터 시트 다시 불러와도 지워지지 않도록
  pushHist(t, '오늘로 넘김', [{ label:'날짜', from:t.date, to:todayStr() }]);
  t.date = todayStr();
  renderAll();
}
async function carryAllToToday(){
  const list = carryCandidates();
  if(!list.length) return;
  if(!(await smConfirm(`못한 일 ${list.length}건을 오늘로 넘길까요?`, `최근 ${WL_CARRY_DAYS}일 동안 끝내지 못한 일이에요.`, { icon:'→', okText:'넘기기' }))) return;
  const todayS = todayStr();
  list.forEach(t => {
    if(!t.movedFrom) t.movedFrom = t.date;
    if(t.source === 'master') t.source = 'moved';
    pushHist(t, '오늘로 넘김', [{ label:'날짜', from:t.date, to:todayS }]);
    t.date = todayS;
  });
  renderAll();
}
function toggleCarryList(){ worklistCarryOpen = !worklistCarryOpen; renderWorklistBody(); }

function wlTaskItem(t, opts = {}){
  const todayS = todayStr();
  const canCarry = !t.done && t.date < todayS;
  return `
    <li class="${t.done ? 'done' : ''}">
      <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})">
      ${opts.showDate ? `<span class="task-date" style="cursor:pointer;" onclick="setWorklistDay('${t.date}')" title="이 날짜로 이동">${shortDate(t.date)}</span>` : ''}
      <span class="task-text">${t.text}${t.movedFrom ? ` <span class="wl-moved">${shortDate(t.movedFrom)}에서 넘어옴</span>` : ''}</span>
      ${canCarry ? `<button class="btn xs" onclick="carryTaskToToday(${t.id})" title="오늘 할 일로 옮기기">오늘로 →</button>` : ''}
      ${actionIcons(`editTask(${t.id})`, `showTaskHistory(${t.id})`, `deleteTask(${t.id})`)}
    </li>`;
}

function renderWorklistBody(){
  const body = document.getElementById('worklistAgenda');
  if(!body) return;
  const todayS = todayStr();
  const date = worklistViewDate || todayS;

  const label = document.getElementById('wlDayLabel');
  if(label){
    const rel = date === todayS ? '오늘' : date === addDaysStr(todayS, -1) ? '어제' : date === addDaysStr(todayS, 1) ? '내일' : '';
    label.innerHTML = `${worklistDayLabel(date)}${rel && rel !== '오늘' ? ` <span class="wl-rel">${rel}</span>` : ''}`;
  }
  const slot = document.getElementById('wlTodayBtnSlot');
  if(slot) slot.innerHTML = `<button class="wl-today-btn ${date === todayS ? 'on' : ''}" onclick="setWorklistDay(todayStr())" title="오늘로 이동">오늘</button>`;

  // 미완료 넘기기 배너: 오늘 화면에서만
  const carryEl = document.getElementById('worklistCarry');
  if(carryEl){
    const cands = (date === todayS && !worklistSearch.trim()) ? carryCandidates() : [];
    carryEl.innerHTML = cands.length ? `
      <div class="wl-carry">
        <div class="wl-carry-head">
          <span>지난 ${WL_CARRY_DAYS}일 동안 못한 일 <b>${cands.length}건</b></span>
          <span style="display:flex; gap:6px;">
            <button class="btn ghost xs" onclick="toggleCarryList()">${worklistCarryOpen ? '접기' : '골라서 넘기기'}</button>
            <button class="btn primary xs" onclick="carryAllToToday()">모두 오늘로</button>
          </span>
        </div>
        ${worklistCarryOpen ? `<ul class="task-list">${cands.map(t => wlTaskItem(t, {showDate:true})).join('')}</ul>` : ''}
      </div>` : '';
  }

  const q = worklistSearch.trim().toLowerCase();
  if(q){
    const hits = tasks.filter(t => (t.text || '').toLowerCase().includes(q))
                      .sort((a, b) => b.date.localeCompare(a.date));
    body.innerHTML = hits.length ? `
      <div class="wl-day-head">검색 결과 ${hits.length}건 · 날짜를 누르면 그 날로 이동해요</div>
      <ul class="task-list">${hits.map(t => wlTaskItem(t, {showDate:true})).join('')}</ul>`
      : `<div class="empty">"${escapeAttr(worklistSearch)}" 검색 결과가 없습니다.</div>`;
    return;
  }

  const dayTasks = tasks.filter(t => t.date === date);
  const left = dayTasks.filter(t => !t.done).length;
  body.innerHTML = dayTasks.length ? `
      <div class="wl-day-head">${dayTasks.length}건 · 남은 일 ${left}건</div>
      <ul class="task-list">${dayTasks.map(t => wlTaskItem(t)).join('')}</ul>`
    : `<div class="empty">이 날은 등록된 할 일이 없어요.</div>`;
}

let wlSwipeBound = false;
function bindWorklistSwipe(){
  const el = document.getElementById('worklistAgenda');
  if(!el) return;
  let sx = null, sy = null;
  el.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  el.addEventListener('touchend', e => {
    if(sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && !worklistSearch.trim()) shiftWorklistDay(dx < 0 ? 1 : -1);
  }, {passive:true});
  if(!wlSwipeBound){
    wlSwipeBound = true;
    document.addEventListener('keydown', e => {
      if(typeof activeTab === 'undefined' || activeTab !== 'worklist') return;
      const tag = (e.target.tagName || '').toLowerCase();
      if(tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
      if(e.key === 'ArrowLeft'){ shiftWorklistDay(-1); e.preventDefault(); }
      if(e.key === 'ArrowRight'){ shiftWorklistDay(1); e.preventDefault(); }
    });
  }
}

// 거래처 목록 기준으로 각 신고 탭의 줄을 자동으로 맞춤 (새 거래처는 자동 추가, 기존 입력값은 유지)
function ensureTaxRows(){
  const def = {
    vat: () => ({target:true, office:'', sales:0, purchase:0, filedDate:'', paidDate:'', note:''}),
    pay: () => ({salaryType:'근로', payday:'', closed:false, filedDate:'', paidSlipDate:'', note:''}),
    corp: () => ({steps:Object.fromEntries(corpSteps.map(s=>[s,''])), note:''}),
    indiv: () => ({honest:false, steps:Object.fromEntries(indivSteps.map(s=>[s,''])), note:''}),
  };
  const fill = (store, key, list, mk) => { store[key] = store[key] || {}; list.forEach(c => { if(!store[key][c.id]) store[key][c.id] = mk(); }); };
  // 한 번만: 예전 예시 데이터(없어진 거래처 번호) 정리
  if(sheetLoadedOnce && clients.length && !settings.taxCleanV1){
    const ids = new Set(clients.map(c => String(c.id)));
    [vatData, payData, corpData, indivData].forEach(store => Object.values(store).forEach(per => {
      Object.keys(per || {}).forEach(id => { if(!ids.has(String(id))) delete per[id]; });
    }));
    settings.taxCleanV1 = true;
  }
  if(currentVatPeriod) fill(vatData, currentVatPeriod, clients, def.vat);
  if(currentPayMonth) fill(payData, currentPayMonth, clients, def.pay);
  if(typeof currentCorpYear !== 'undefined' && currentCorpYear) fill(corpData, currentCorpYear, corpClients(), def.corp);
  if(typeof currentIndivYear !== 'undefined' && currentIndivYear) fill(indivData, currentIndivYear, indivClients(), def.indiv);
}
// 원천세: 이번 달·다음 달이 목록에 없으면 자동 추가 (신고기한 = 다음 달 10일)
function ensurePayMonths(){
  const now = new Date();
  [0, -1].forEach(off => {
    const d = new Date(now.getFullYear(), now.getMonth() + off, 1);
    const key = `${d.getMonth() + 1}월`;
    if(!payMonths.includes(key)){
      payMonths.push(key);
      const due = new Date(d.getFullYear(), d.getMonth() + 1, 10);
      payDue[key] = `${due.getFullYear()}-${pad2(due.getMonth()+1)}-${pad2(due.getDate())}`;
    }
  });
}
function vatSummary(){
  const d = vatData[currentVatPeriod] || {};

  renderVat();
}

function clientKeywords(c){

  return [...words].filter(w => w.length >= 2);
}
