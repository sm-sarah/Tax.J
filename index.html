  · 로그인 화면 모양은 앱의 로그인 화면(#appLoginGate)과 똑같이 맞춰서, 앱으로 넘어갈 때 화면이 바뀌지 않게 함

  · 받은 앱은 이 기기에 저장해 두고(IndexedDB), 새 버전이 올라왔을 때만 다시 받음
  · 받은 파일 전체의 지문(SHA-256)을 확인한 뒤에만 실행 - 일부만 받았거나 섞이면 실행하지 않음

<style>
  :root{
    /* 배경 3단(페이지 --bg → 큰 테두리 --frame-bg → 그 안의 흰 콘텐츠 박스 --surface)의 톤이 서로 안 어울린다는
       피드백이 있었음 - 흰색(--surface)은 앱 전체에 셀 수 없이 많이 쓰여있어 손대기 위험하니 기준으로 고정하고,
       나머지 둘(--bg, --frame-bg)을 브랜드 색(--indigo/--navy)과 같은 인디고 계열 색조(hue)로 맞춤 -
       페이지가 가장 옅고(연한 인디고), 그 안의 큰 테두리가 그보다 살짝 채도 있게 해서 흰 박스 쪽으로 갈수록
       자연스럽게 밝아지는 순서(--bg < --frame-bg < --surface)로 정리함 */
    --bg:#EAECF7;
    --surface:#FFFFFF;
    --frame-bg:#ECEEFB;
    --ink:#1D1E33;
    --ink-soft:#75789A;
    --ink-label:#4B4E68;
    --border:rgba(29,30,51,0.14);
    --input-bg:#F7F8FC;

    --indigo:#5B5FEF; --indigo-bg:#ECEBFE; --indigo-deep:#4640D6;
    --navy:#1E2A5E;
    --navy-bg:#E6E9F5;

<script>
(function(){
  var CFG = {
  apiKey: "AIzaSyArJvHCtIMwn0GHZXOXQSNIqZnvyN--tgw",
  authDomain: "taxj-a3e01.firebaseapp.com",
  projectId: "taxj-a3e01",
  storageBucket: "taxj-a3e01.firebasestorage.app",
  databaseURL: "https://taxj-a3e01-default-rtdb.asia-southeast1.firebasedatabase.app",
  messagingSenderId: "669418345168",
  appId: "1:669418345168:web:5cce25e2573fa5e05cc4d5",
  measurementId: "G-MXEHN1QCJE"
};
  var DEFAULT_CLIENT_ID = '273460053868-nbc6qpi148vv3lkobhrqnrtn8vvk8num.apps.googleusercontent.com';
  var SCOPE = 'https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/userinfo.email';
  var COMPANY = /^[^@\s]+@ciacc\.co\.kr$/i;
  var CODE_COL = 'taxj_code';
  var btn = document.getElementById('loginGateConnectBtn');
  var msg = document.getElementById('loginGateStatusMsg');
  function say(t){ if(msg) msg.textContent = t || ''; }
  function ls(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
  function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
  function timeout(p, ms, label){ return Promise.race([p, new Promise(function(_, no){ setTimeout(function(){ no(new Error(label || 'timeout')); }, ms); })]); }

  // 앱과 같은 자동 배율 - PC에서 창 폭이 1300px보다 좁으면 화면 전체를 그 비율만큼 줄여 그림(앱 로그인 화면과 크기를 똑같이)
  function autoZoom(){
    var touch = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
    var w = window.innerWidth, z = (touch || w >= 1300) ? 1 : Math.max(0.28, w / 1300);
    document.documentElement.style.zoom = z === 1 ? '' : z;
  }
  autoZoom();
  window.addEventListener('resize', autoZoom);
  // 이 기기에 저장해 둔 앱 버전을 로그인 화면 아래에 표시(앱 로그인 화면과 같은 자리)
  function showBuild(b){ var el = document.querySelector('.app-build-label'); if(el && b) el.textContent = '버전 ' + b; }

  if(typeof firebase === 'undefined'){ say('불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'); return; }
  firebase.initializeApp(CFG);
  var auth = firebase.auth(), db = firebase.firestore();
  var loading = false;

  // ── 이 기기에 저장해 둔 앱(IndexedDB) ──
  function idb(){ return new Promise(function(ok, no){ try{ var r = indexedDB.open('taxj_shell', 1); r.onupgradeneeded = function(){ r.result.createObjectStore('code'); }; r.onsuccess = function(){ ok(r.result); }; r.onerror = function(){ no(r.error); }; }catch(e){ no(e); } }); }
  function cacheGet(){ return idb().then(function(d){ return new Promise(function(ok){ var q = d.transaction('code').objectStore('code').get('app'); q.onsuccess = function(){ ok(q.result || null); }; q.onerror = function(){ ok(null); }; }); }).catch(function(){ return null; }); }
  function cachePut(v){ return idb().then(function(d){ return new Promise(function(ok){ var t = d.transaction('code', 'readwrite'); t.objectStore('code').put(v, 'app'); t.oncomplete = function(){ ok(); }; t.onerror = function(){ ok(); }; }); }).catch(function(){}); }
  function sha256(text){ return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(b){ return Array.from(new Uint8Array(b)).map(function(x){ return x.toString(16).padStart(2, '0'); }).join(''); }); }

  // ── 받은 앱을 이 창에서 실행 ──
  function run(html){
    say('');
    // 이 화면에서 쓴 Firebase·Google 로그인 도구는 정리하고, 앱이 자기 것을 처음부터 다시 불러 쓰게 함
    return timeout(firebase.app().delete(), 800).catch(function(){}).then(function(){
      try{ delete window.firebase; }catch(e){}
      try{ delete window.google; }catch(e){}
      window.removeEventListener('resize', autoZoom);
      document.open();
      document.write(html);
      document.close();
    });
  }

  // ── 앱 받기: 버전 확인(문서 1개) → 저장해 둔 것과 같으면 그대로, 다르면 조각들을 받아 지문 확인 ──
  function loadApp(){
    if(loading) return; loading = true;
    if(btn) btn.disabled = true;
    say('불러오는 중이에요…');
    var cachedP = cacheGet();
    return timeout(db.collection(CODE_COL).doc('meta').get(), 12000, 'offline').then(function(s){
      var meta = s.exists ? s.data() : null;
      if(!meta || !meta.ver || !meta.n) throw new Error('앱이 아직 올라가 있지 않아요. 관리자에게 알려 주세요.');
      return cachedP.then(function(c){
        if(c && c.ver === meta.ver && c.sha === meta.sha && c.html) return run(c.html);
        var gets = [];
        for(var i = 0; i < meta.n; i++) gets.push(db.collection(CODE_COL).doc('p_' + meta.ver + '_' + i).get());
        return Promise.all(gets).then(function(parts){
          var html = parts.map(function(p){ var d = p.exists ? p.data() : null; if(!d || d.ver !== meta.ver) throw new Error('새 버전을 올리는 중이에요. 잠시 뒤 새로고침해 주세요.'); return d.j; }).join('');
          return sha256(html).then(function(h){
            if(h !== meta.sha) throw new Error('받은 파일이 완전하지 않아요. 잠시 뒤 새로고침해 주세요.');
            return cachePut({ ver: meta.ver, sha: meta.sha, build: meta.build || '', html: html }).then(function(){ return run(html); });
          });
        });
      });
    }).catch(function(e){
      var code = e && e.code;
      if(code === 'permission-denied'){ loading = false; if(btn) btn.disabled = false; say('회사 계정(@ciacc.co.kr)으로 로그인해 주세요.'); return auth.signOut().catch(function(){}); }
      // 인터넷이 끊겼으면 이 기기에 저장해 둔 앱으로 엶
      if(e && (e.message === 'offline' || code === 'unavailable')){
        return cachedP.then(function(c){ if(c && c.html) return run(c.html); loading = false; if(btn) btn.disabled = false; say('인터넷 연결을 확인하고 새로고침해 주세요.'); });
      }
      console.error('앱 불러오기 실패', e);
      loading = false; if(btn) btn.disabled = false;
      say((e && e.message) || '불러오지 못했어요. 새로고침해 주세요.');
    });
  }

  function okUser(u){ return !!(u && u.emailVerified && COMPANY.test(String(u.email || ''))); }

  // ── 로그인 버튼: 앱과 같은 방식(Google 토큰 → Firebase)으로 로그인하고, 받은 토큰을 앱이 쓰는 자리에 저장해
  //    앱이 열린 뒤 로그인 창을 다시 띄우지 않게 함 ──
  if(btn) btn.addEventListener('click', function(){
    if(loading) return;
    if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2){ say('Google 로그인 도구를 불러오지 못했어요. 새로고침해 주세요.'); return; }
    var scope = SCOPE + (ls('taxj_gmail_unread_pref') === 'on' ? ' https://www.googleapis.com/auth/gmail.metadata' : '');
    var hint = ls('taxj_login_hint');
    var opts = { client_id: ls('worklog_gdrive_client_id') || DEFAULT_CLIENT_ID, scope: scope, include_granted_scopes: true, hd: 'ciacc.co.kr', callback: function(resp){
      if(!resp || resp.error){ say('로그인하지 못했어요' + (resp && resp.error ? ' (' + resp.error + ')' : '')); return; }
      lsSet('worklog_gdrive_token', resp.access_token);
      lsSet('worklog_gdrive_token_expiry', String(Date.now() + Number(resp.expires_in || 3600) * 1000));
      say('로그인 확인 중이에요…');
      auth.signInWithCredential(firebase.auth.GoogleAuthProvider.credential(null, resp.access_token)).then(function(){
        var u = auth.currentUser;
        if(!okUser(u)){ say('회사 계정(@ciacc.co.kr)으로 로그인해 주세요.'); return auth.signOut(); }
        lsSet('taxj_login_hint', String(u.email).toLowerCase());
        return loadApp();
      }).catch(function(e){ console.error('로그인 실패', e); say('로그인하지 못했어요. 다시 눌러 주세요.'); });
    }};
    if(hint) opts.login_hint = hint;
    google.accounts.oauth2.initTokenClient(opts).requestAccessToken({});
  });

  cacheGet().then(function(c){ if(c) showBuild(c.build); });

  // ── 이미 로그인한 기기면 바로 앱으로 ──
  var settled = false;
  var un = auth.onAuthStateChanged(function(u){
    if(settled) return; settled = true;
    try{ un && un(); }catch(e){}
    if(okUser(u)) loadApp();
    else if(u) auth.signOut().catch(function(){});
  });
})();
</script>
