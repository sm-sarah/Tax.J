<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>출퇴근 색·버튼 스타일</title>
<style>
  *{ box-sizing:border-box; } body{ margin:0; background:#EEEFF9; font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:#1D1E33; padding:24px 16px 40px; }
  h1{ text-align:center; font-size:18px; margin:0 0 4px; color:#1E2A5E; } .sub{ text-align:center; font-size:12px; color:#7A7F9A; margin:0 0 22px; }
  .grid{ display:flex; gap:22px; justify-content:center; flex-wrap:wrap; align-items:flex-start; }
  .opt{ width:290px; } .opt h2{ font-size:13.5px; margin:0 0 3px; color:#1E2A5E; text-align:center; } .opt p.d{ font-size:11.5px; color:#7A7F9A; margin:0 0 10px; text-align:center; line-height:1.5; min-height:34px; }
  .card{ border-radius:22px; padding:16px 18px 18px; box-shadow:0 10px 30px -18px rgba(29,30,51,.35); border:1px solid #ECEDF8; background:linear-gradient(160deg,#F8F8FF 0%,#FFFFFF 55%,#EAFBF4 100%); }
  .head{ display:flex; align-items:center; gap:8px; padding-bottom:10px; border-bottom:1.5px solid #D9DBF3; margin-bottom:8px; }
  .hic{ width:24px; height:24px; border-radius:8px; background:#5B5FEF; color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .head b{ font-size:14.5px; } .head .who{ font-size:11px; border:1px solid #E3E5F1; border-radius:12px; padding:2px 8px; background:#fff; } .head .more{ margin-left:auto; font-size:11px; color:#5B5FEF; font-weight:700; }
  .now{ text-align:center; font-family:ui-monospace,'IBM Plex Mono',monospace; font-size:21px; font-weight:800; color:#1E2A5E; margin:2px 0 4px; }
  .mascot{ width:112px; height:112px; margin:0 auto; border-radius:50%; background:radial-gradient(circle,#C7EEE0 58%,transparent 80%); display:flex; align-items:center; justify-content:center; outline:2px dashed #A9DCC8; outline-offset:-6px; }
  .mascot svg{ width:78px; height:78px; }
  .toggle{ display:flex; justify-content:center; margin:8px 0 12px; } .toggle span{ font-size:11.5px; font-weight:800; padding:4px 12px; border-radius:14px; color:#7A7F9A; } .toggle span.on{ background:#5B5FEF; color:#fff; }
  .row{ display:flex; align-items:flex-end; justify-content:center; gap:10px; }
  .col{ text-align:center; font-size:10.5px; font-weight:700; }
  .box{ margin-top:4px; font-family:ui-monospace,'IBM Plex Mono',monospace; font-weight:800; font-size:17px; padding:7px 12px; min-width:104px; }
  .arrow{ padding-bottom:9px; font-weight:900; }
  .msg{ text-align:center; font-size:12.5px; font-weight:700; margin:10px 0 8px; }
  .week{ font-size:10.5px; display:flex; justify-content:space-between; margin-top:6px; opacity:.85; } .bar{ height:6px; border-radius:3px; overflow:hidden; margin-top:3px; } .bar i{ display:block; height:100%; width:72%; }
  .btnrow{ display:flex; justify-content:center; align-items:center; gap:8px; margin-top:14px; }
  .undo{ width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .btn{ font-size:12.5px; font-weight:800; display:inline-flex; align-items:center; gap:5px; }
  .btn svg{ width:13px; height:13px; }
  .note{ font-size:11.5px; color:#7A7F9A; text-align:center; margin-top:18px; line-height:1.6; }

  /* 1 지금 톤 정리: 민트 출근 · 라벤더 퇴근 · 그라데이션 알약 버튼 */
  .t1 .col{ color:#7A7F9A; } .t1 .box.in{ background:#E3F7EF; color:#0FB88A; border-radius:12px; } .t1 .box.out{ background:#EEF0F8; color:#A6ABC4; border-radius:12px; }
  .t1 .arrow{ color:#5B5FEF; } .t1 .msg{ color:#5B5FEF; } .t1 .week{ color:#7A7F9A; } .t1 .bar{ background:#E9EAF4; } .t1 .bar i{ background:linear-gradient(90deg,#8FD8C3,#5B5FEF); }
  .t1 .btn{ background:linear-gradient(135deg,#F7849B,#F0506E); color:#fff; padding:8px 22px; border-radius:20px; box-shadow:0 6px 14px -6px rgba(240,80,110,.7); } .t1 .undo{ background:#EEF0F8; color:#7A7F9A; }

  /* 2 네이비 모노 */
  .t2 .col{ color:#1E2A5E; } .t2 .box{ background:#fff; border:1.5px solid #1E2A5E; border-radius:10px; color:#1E2A5E; } .t2 .box.out{ border-style:dashed; color:#9AA0BC; border-color:#9AA0BC; }
  .t2 .arrow{ color:#1E2A5E; } .t2 .msg{ color:#1E2A5E; } .t2 .week{ color:#1E2A5E; } .t2 .bar{ background:#E3E5F1; } .t2 .bar i{ background:#1E2A5E; }
  .t2 .btn{ background:#1E2A5E; color:#fff; padding:9px 26px; border-radius:10px; } .t2 .undo{ border:1.5px solid #1E2A5E; color:#1E2A5E; border-radius:10px; }

  /* 3 선셋(피치·라일락) */
  .t3 .col{ color:#B26A5B; } .t3 .box.in{ background:linear-gradient(135deg,#FFE3D6,#FFF1EA); color:#E0673F; border-radius:16px; } .t3 .box.out{ background:linear-gradient(135deg,#EDE4FF,#F7F2FF); color:#A99BD6; border-radius:16px; }
  .t3 .arrow{ color:#E9A23B; } .t3 .msg{ color:#D2643E; } .t3 .week{ color:#B26A5B; } .t3 .bar{ background:#F5E9E4; } .t3 .bar i{ background:linear-gradient(90deg,#FFB48A,#B79BF5); }
  .t3 .btn{ background:linear-gradient(135deg,#FFB48A,#F17A9A); color:#fff; padding:9px 24px; border-radius:22px; box-shadow:0 8px 16px -8px rgba(241,122,154,.8); } .t3 .undo{ background:#FFF1EA; color:#E0673F; }

  /* 4 글래스(유리) */
  .t4.card{ background:linear-gradient(160deg,#DCE0FF 0%,#EAF6FF 50%,#DDF7EE 100%); }
  .t4 .col{ color:#4A5178; } .t4 .box{ background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.9); border-radius:14px; color:#1E2A5E; box-shadow:0 4px 12px -8px rgba(29,30,51,.4); } .t4 .box.out{ color:#9AA0BC; }
  .t4 .arrow{ color:#fff; text-shadow:0 1px 3px rgba(29,30,51,.3); } .t4 .msg{ color:#3B40C4; } .t4 .week{ color:#4A5178; } .t4 .bar{ background:rgba(255,255,255,.6); } .t4 .bar i{ background:#5B5FEF; }
  .t4 .btn{ background:rgba(255,255,255,.7); color:#F0506E; border:1px solid rgba(255,255,255,.95); padding:8px 24px; border-radius:20px; box-shadow:0 6px 16px -10px rgba(29,30,51,.5); } .t4 .undo{ background:rgba(255,255,255,.6); color:#4A5178; }

  /* 5 아웃라인 미니멀 */
  .t5 .col{ color:#9AA0BC; font-weight:600; } .t5 .box{ background:transparent; border-bottom:2px solid #0FB88A; border-radius:0; color:#1D1E33; padding:4px 6px; } .t5 .box.out{ border-color:#D5D8E8; color:#B5B9CE; }
  .t5 .arrow{ color:#C9CBF7; } .t5 .msg{ color:#6B7090; font-weight:600; } .t5 .week{ color:#9AA0BC; } .t5 .bar{ background:#EEF0F6; height:3px; } .t5 .bar i{ background:#1D1E33; }
  .t5 .btn{ background:transparent; color:#F0506E; border:1.5px solid #F0506E; padding:7px 24px; border-radius:20px; } .t5 .undo{ border:1.5px solid #D5D8E8; color:#9AA0BC; }

  /* 6 포인트 컬러 + 큰 원형 버튼 */
  .t6 .col{ color:#7A7F9A; } .t6 .box{ border-radius:999px; font-size:15px; padding:6px 14px; } .t6 .box.in{ background:#0FB88A; color:#fff; } .t6 .box.out{ background:#fff; color:#B5B9CE; border:1.5px solid #E3E5F1; }
  .t6 .arrow{ color:#0FB88A; } .t6 .msg{ color:#0B8A66; } .t6 .week{ color:#7A7F9A; } .t6 .bar{ background:#E3F7EF; } .t6 .bar i{ background:#0FB88A; }
  .t6 .btn{ width:64px; height:64px; border-radius:50%; flex-direction:column; justify-content:center; gap:2px; background:radial-gradient(circle at 30% 30%,#FF8FA5,#F0506E); color:#fff; font-size:11.5px; box-shadow:0 10px 20px -8px rgba(240,80,110,.8), inset 0 -3px 0 rgba(0,0,0,.08); }
  .t6 .btn svg{ width:18px; height:18px; } .t6 .undo{ background:#F2F3F9; color:#7A7F9A; }
</style></head><body>
<h1>출퇴근 카드 · 색과 버튼 스타일만 바꾼 예시</h1>
<p class="sub">구성은 지금 그대로(출근 → 퇴근 · 멘트 · 이번 주 누적 · 퇴근 버튼) · 캐릭터·시계·사무실/재택도 그대로 · 색·모양만 다름</p>
<div class="grid" id="g"></div>
<p class="note">출근 전에는 같은 자리에 "출근" 버튼이 같은 스타일로 나와요(색만 출근용으로). 색은 하나, 버튼은 다른 것에서 골라 섞어도 돼요. 예: "3번 색 + 6번 버튼"</p>
<script>
const M = "<svg viewBox=\"0 0 120 128\" width=\"86\" height=\"92\" aria-hidden=\"true\"><circle cx=\"60\" cy=\"60\" r=\"32.6\" fill=\"#2B2A33\"></circle><circle cx=\"60\" cy=\"26\" r=\"15.6\" fill=\"#2B2A33\"></circle><circle cx=\"79\" cy=\"30\" r=\"13.6\" fill=\"#2B2A33\"></circle><circle cx=\"92\" cy=\"44\" r=\"14.6\" fill=\"#2B2A33\"></circle><circle cx=\"97\" cy=\"63\" r=\"14.6\" fill=\"#2B2A33\"></circle><circle cx=\"92\" cy=\"82\" r=\"14.6\" fill=\"#2B2A33\"></circle><circle cx=\"78\" cy=\"92\" r=\"13.6\" fill=\"#2B2A33\"></circle><circle cx=\"60\" cy=\"96\" r=\"14.6\" fill=\"#2B2A33\"></circle><circle cx=\"42\" cy=\"92\" r=\"13.6\" fill=\"#2B2A33\"></circle><circle cx=\"28\" cy=\"82\" r=\"14.6\" fill=\"#2B2A33\"></circle><circle cx=\"23\" cy=\"63\" r=\"14.6\" fill=\"#2B2A33\"></circle><circle cx=\"28\" cy=\"44\" r=\"14.6\" fill=\"#2B2A33\"></circle><circle cx=\"41\" cy=\"30\" r=\"13.6\" fill=\"#2B2A33\"></circle><circle cx=\"60\" cy=\"60\" r=\"30\" fill=\"#FFFFFF\"></circle><circle cx=\"60\" cy=\"26\" r=\"13\" fill=\"#FFFFFF\"></circle><circle cx=\"79\" cy=\"30\" r=\"11\" fill=\"#FFFFFF\"></circle><circle cx=\"92\" cy=\"44\" r=\"12\" fill=\"#FFFFFF\"></circle><circle cx=\"97\" cy=\"63\" r=\"12\" fill=\"#FFFFFF\"></circle><circle cx=\"92\" cy=\"82\" r=\"12\" fill=\"#FFFFFF\"></circle><circle cx=\"78\" cy=\"92\" r=\"11\" fill=\"#FFFFFF\"></circle><circle cx=\"60\" cy=\"96\" r=\"12\" fill=\"#FFFFFF\"></circle><circle cx=\"42\" cy=\"92\" r=\"11\" fill=\"#FFFFFF\"></circle><circle cx=\"28\" cy=\"82\" r=\"12\" fill=\"#FFFFFF\"></circle><circle cx=\"23\" cy=\"63\" r=\"12\" fill=\"#FFFFFF\"></circle><circle cx=\"28\" cy=\"44\" r=\"12\" fill=\"#FFFFFF\"></circle><circle cx=\"41\" cy=\"30\" r=\"11\" fill=\"#FFFFFF\"></circle><ellipse cx=\"40\" cy=\"73\" rx=\"6\" ry=\"4\" fill=\"#FFC9C9\"></ellipse><ellipse cx=\"80\" cy=\"73\" rx=\"6\" ry=\"4\" fill=\"#FFC9C9\"></ellipse><circle cx=\"46\" cy=\"58\" r=\"6\" fill=\"#2B2A33\"></circle><circle cx=\"44\" cy=\"56\" r=\"1.8\" fill=\"#fff\"></circle><circle cx=\"74\" cy=\"58\" r=\"6\" fill=\"#2B2A33\"></circle><circle cx=\"72\" cy=\"56\" r=\"1.8\" fill=\"#fff\"></circle><ellipse cx=\"60\" cy=\"68\" rx=\"5\" ry=\"3.8\" fill=\"#2B2A33\"></ellipse><path d=\"M52.5,75 Q60,82 67.5,75\" stroke=\"#2B2A33\" stroke-width=\"2.8\" fill=\"none\" stroke-linecap=\"round\"></path></svg>";
const TOPHTML = `<div class="head"><span class="hic">⏱</span><b>출퇴근</b><span class="who">장선민 ▾</span><span class="more">전체이력 →</span></div><div class="now">15:32:09</div><div class="mascot">${M}</div><div class="toggle"><span class="on">사무실</span><span>재택</span></div>`;
const OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14"/></svg>';
const O = [
  ['t1','1. 지금 톤 정리','지금 색 그대로 정돈 · 퇴근 버튼만 그라데이션 알약으로 또렷하게'],
  ['t2','2. 네이비 모노','남색 한 가지 색으로 단정하게 · 로고와 가장 잘 어울림 · 네모 버튼'],
  ['t3','3. 선셋(피치·라일락)','따뜻한 복숭아·연보라 톤 · 부드럽고 기분 좋은 느낌'],
  ['t4','4. 글래스(유리)','카드 배경에 은은한 색을 깔고 반투명 유리 상자 · 요즘 앱 느낌'],
  ['t5','5. 미니멀 라인','상자 없이 밑줄과 글자색만 · 가장 가볍고 깔끔함 · 테두리 버튼'],
  ['t6','6. 포인트 컬러 + 원형 버튼','출근 시각을 민트 알약으로 강조 · 퇴근은 큼직한 동그란 버튼'],
];
document.getElementById('g').innerHTML = O.map(([c,t,d])=>`<div class="opt"><h2>${t}</h2><p class="d">${d}</p><div class="card ${c}">${TOPHTML}
  <div class="row"><div class="col">출근<div class="box in">09:21:33</div></div><div class="arrow">→</div><div class="col">퇴근<div class="box out">--:--</div></div></div>
  <div class="msg">퇴근까지 2시간 28분 · 조금만 더 힘내요 💪</div>
  <div class="week"><span>이번 주 누적</span><span>28h 40m / 40h</span></div><div class="bar"><i></i></div>
  <div class="btnrow"><span class="btn">${OUT}퇴근</span><span class="undo">↶</span></div></div></div>`).join('');
</script></body></html>
